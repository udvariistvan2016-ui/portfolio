<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Számla-tracker — pipeline demó</title>
<style>
/* ═════════════════════════════════════════════════════════
   TÉMA-VÁLTOZÓK — a read-it-later viz témája, változatlanul.
   ═════════════════════════════════════════════════════════ */
:root {
  --bg:#f4f6fa;
  --text-strong:#16233b; --text-mid:#5d6b82; --text-dim:#7a8699;
  --panel:rgba(244,246,250,.92); --panel-border:#dde3ed;
  --card-bg:#ffffff; --card-border:#e2e8f2;
  --tt-bg:#ffffff; --tt-border:#d7dfeb; --tt-shadow:rgba(22,35,59,.16);
  --tt-desc:#3d4a61; --tt-io:#7a8699; --tt-type:#9a6700;
  --btn-bg:#ffffff; --btn-border:#c9d2e0; --btn-text:#3d4a61;
  --btn-hover:#eef2f8; --btn-active-bg:#2f6fdb; --btn-active-text:#ffffff;
  --badge-bg:#e3e9f2; --badge-text:#4a5a75;
  --badge-run-bg:#fdf0d5; --badge-run-text:#9a6700;
  --badge-done-bg:#d9f2e0; --badge-done-text:#116632;
  --badge-err-bg:#fde0e4; --badge-err-text:#a3132f;
  --badge-lost-bg:#eceff4; --badge-lost-text:#8a94a6;
  --badge-info-bg:#e2ecfb; --badge-info-text:#274f8f;
  --chip-bg:#e8eef8; --chip-text:#33517e;
  --chip-active-bg:#2f6fdb; --chip-active-text:#ffffff;
  --scroll-track:#e9edf4; --scroll-thumb:#c2cbd9;
  --st-pending:#c2cbd9; --st-running:#e8a200; --st-done:#1a9e50; --st-error:#d94560;
  --cat-input:#2f6fdb; --cat-transform:#1a9e78; --cat-ai:#8a4bdb;
  --cat-output:#d97c10; --cat-merge:#d94560;
}
:root[data-theme="dark"] {
  --bg:#070d18;
  --text-strong:#e9f0ff; --text-mid:#93a5c4; --text-dim:#6b7f9f;
  --panel:rgba(7,13,24,.92); --panel-border:#1c2a44;
  --card-bg:#0e1830; --card-border:#22304d;
  --tt-bg:#0e1830; --tt-border:#27395c; --tt-shadow:rgba(0,0,0,.55);
  --tt-desc:#b9c7e0; --tt-io:#748ab0; --tt-type:#ffbb33;
  --btn-bg:#0e1830; --btn-border:#2a3d61; --btn-text:#b9c7e0;
  --btn-hover:#16244077; --btn-active-bg:#4d8dff; --btn-active-text:#04101f;
  --badge-bg:#14213a; --badge-text:#8fa3c6;
  --badge-run-bg:#2a2008; --badge-run-text:#ffcf6b;
  --badge-done-bg:#062b1a; --badge-done-text:#3fe8ab;
  --badge-err-bg:#2a0d15; --badge-err-text:#ff90a5;
  --badge-lost-bg:#141d30; --badge-lost-text:#6b7f9f;
  --badge-info-bg:#0e2240; --badge-info-text:#7fb0ff;
  --chip-bg:#152640; --chip-text:#9db8e0;
  --chip-active-bg:#4d8dff; --chip-active-text:#04101f;
  --scroll-track:#0c1526; --scroll-thumb:#26375a;
  --st-pending:#3c4d6c; --st-running:#ffbb33; --st-done:#27e07f; --st-error:#ff5f7e;
  --cat-input:#41a6ff; --cat-transform:#22dfa0; --cat-ai:#bf7bff;
  --cat-output:#ffb03a; --cat-merge:#ff5f7e;
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100vw; height:100vh; overflow:hidden;
  background:var(--bg);
  font-family:"Segoe UI", system-ui, sans-serif;
}
#scroll-wrap { width:100vw; height:100vh; overflow:auto; cursor:grab; }
#scroll-wrap:active { cursor:grabbing; }
#stage { position:relative; }
canvas { position:absolute; top:0; left:0; display:block; }

body[data-view="catalog"] #scroll-wrap { display:none; }
body[data-view="catalog"] #legend { display:none; }
body[data-view="dash"] #scroll-wrap { display:none; }
body[data-view="dash"] #legend { display:none; }
#runs-panel { display:none; }
body[data-view="runs"] #runs-panel { display:flex; }
#catalog-view { display:none; }
body[data-view="catalog"] #catalog-view { display:flex; }
#dash-view { display:none; }
body[data-view="dash"] #dash-view { display:flex; }

#header {
  position:fixed; top:0; left:0; right:0;
  padding:16px 24px 12px;
  background:linear-gradient(to bottom, var(--bg) 55%, transparent);
  pointer-events:none; z-index:100;
}
#header h1 { color:var(--text-strong); font-size:20px; font-weight:650; letter-spacing:.4px; }
#header p  { color:var(--text-dim); font-size:12px; margin-top:2px; }
#run-state {
  display:inline-block; margin-top:8px;
  font-size:13px; font-weight:600;
  padding:4px 12px; border-radius:14px;
  background:var(--badge-bg); color:var(--badge-text);
}
#run-state.running { background:var(--badge-run-bg);  color:var(--badge-run-text); }
#run-state.done    { background:var(--badge-done-bg); color:var(--badge-done-text); }
#run-state.error   { background:var(--badge-err-bg);  color:var(--badge-err-text); }
#run-state.lost    { background:var(--badge-lost-bg); color:var(--badge-lost-text); }

#controls {
  position:fixed; top:16px; right:20px;
  display:flex; gap:8px; z-index:110; align-items:center;
  flex-wrap:wrap; justify-content:flex-end; max-width:70vw;
}
#controls button {
  font-family:inherit; font-size:12.5px; font-weight:600;
  color:var(--btn-text);
  background:var(--btn-bg);
  border:1px solid var(--btn-border);
  border-radius:16px; padding:6px 14px;
  cursor:pointer;
}
#controls button:hover:not(:disabled) { background:var(--btn-hover); }
#controls button:disabled { opacity:.45; cursor:default; }
#view-switch { display:flex; border:1px solid var(--btn-border); border-radius:16px; overflow:hidden; }
#view-switch button { border:none; border-radius:0; padding:6px 13px; }
#view-switch button + button { border-left:1px solid var(--btn-border); }
#view-switch button.active {
  background:var(--btn-active-bg); color:var(--btn-active-text);
}

#about {
  position:fixed; top:58px; right:20px;
  max-width:400px; z-index:150;
  background:var(--tt-bg); border:1px solid var(--tt-border);
  border-radius:12px; padding:16px 18px;
  box-shadow:0 10px 32px var(--tt-shadow);
  display:none;
}
#about.show { display:block; }
#about h2 { color:var(--text-strong); font-size:15px; margin-bottom:8px; }
#about p  { color:var(--tt-desc); font-size:13px; line-height:1.6; }

#runs-panel {
  position:fixed; top:100px; bottom:70px; left:20px;
  width:330px; z-index:90;
  flex-direction:column;
  background:var(--panel); border:1px solid var(--panel-border);
  border-radius:12px; overflow:hidden;
}
#runs-head {
  padding:10px 14px; display:flex; align-items:center; gap:8px;
  border-bottom:1px solid var(--panel-border);
}
#runs-head h3 { color:var(--text-strong); font-size:14px; flex:1; }
#runs-list { flex:1; overflow-y:auto; padding:8px; }
.run-item {
  padding:9px 11px; border-radius:9px; cursor:pointer;
  border:1px solid transparent; margin-bottom:4px;
}
.run-item:hover { background:var(--btn-hover); }
.run-item.active { border-color:var(--btn-active-bg); background:var(--btn-hover); }
.run-item .r-top { display:flex; align-items:center; gap:7px; }
.run-item .r-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.run-item .r-date { color:var(--text-strong); font-size:12.5px; font-weight:600; }
.run-item .r-dur { color:var(--text-dim); font-size:11.5px; margin-left:auto; }
.run-item .r-sub { color:var(--text-mid); font-size:11.5px; margin-top:3px; }
#runs-empty { color:var(--text-dim); font-size:12.5px; padding:14px; line-height:1.5; }
.small-btn {
  font-family:inherit; font-size:11.5px; font-weight:600;
  color:var(--btn-text); background:var(--btn-bg);
  border:1px solid var(--btn-border); border-radius:12px;
  padding:4px 10px; cursor:pointer;
}
.small-btn:hover:not(:disabled) { background:var(--btn-hover); }
.small-btn:disabled { opacity:.5; cursor:default; }

/* ── Számlák nézet ───────────────────────────────────── */
#catalog-view {
  position:fixed; top:100px; bottom:20px; left:24px; right:24px;
  z-index:90; flex-direction:column; gap:10px;
}
#catalog-controls {
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
#catalog-search {
  font-family:inherit; font-size:13px;
  color:var(--text-strong); background:var(--card-bg);
  border:1px solid var(--btn-border); border-radius:16px;
  padding:7px 14px; width:300px; outline:none;
}
#catalog-count { color:var(--text-dim); font-size:12.5px; }
#kw-chips { display:flex; gap:6px; flex-wrap:wrap; }
.chip {
  font-size:11.5px; font-weight:600; cursor:pointer;
  background:var(--chip-bg); color:var(--chip-text);
  border:none; border-radius:11px; padding:4px 10px;
  font-family:inherit;
}
.chip.active { background:var(--chip-active-bg); color:var(--chip-active-text); }
#catalog-list {
  flex:1; overflow-y:auto; padding-right:6px;
  display:grid; gap:10px;
  grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
  align-content:start;
}
.cat-card {
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:11px; padding:13px 15px;
}
.cat-card .c-top { display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
.cat-card .c-date { color:var(--text-dim); font-size:11.5px; }
.cat-card .c-type {
  font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  border-radius:9px; padding:2px 8px;
}
.c-type.szamla        { background:var(--badge-done-bg); color:var(--badge-done-text); }
.c-type.visszaigazolas{ background:var(--badge-info-bg); color:var(--badge-info-text); }
.c-type.felszolitas   { background:var(--badge-err-bg);  color:var(--badge-err-text); }
.cat-card h4 { margin-bottom:2px; font-size:14.5px; color:var(--text-strong); }
.cat-card .c-amount { font-size:17px; font-weight:700; color:var(--text-strong); }
.cat-card .c-sum { color:var(--text-mid); font-size:12.5px; line-height:1.55; margin:4px 0 8px; }
.cat-card .c-kws { display:flex; gap:5px; flex-wrap:wrap; align-items:center; }
#catalog-empty { color:var(--text-dim); font-size:13px; padding:20px; }
.c-cost { margin-left:auto; color:var(--text-dim); font-size:11px; font-weight:600; }
.c-paid {
  font-family:inherit; font-size:10.5px; font-weight:700; cursor:pointer;
  border:none; border-radius:9px; padding:2px 9px;
  background:var(--badge-done-bg); color:var(--badge-done-text);
}
.c-paid.undo { background:var(--badge-err-bg); color:var(--badge-err-text); }
.c-note {
  font-size:10.5px; font-weight:600; border-radius:9px; padding:2px 8px;
  background:var(--badge-run-bg); color:var(--badge-run-text);
}
.c-paidmark {
  font-size:10.5px; font-weight:700; border-radius:9px; padding:2px 8px;
  background:var(--badge-done-bg); color:var(--badge-done-text);
}
.c-overdue {
  font-size:10.5px; font-weight:700; border-radius:9px; padding:2px 8px;
  background:var(--badge-err-bg); color:var(--badge-err-text);
}
.c-link { font-size:11.5px; color:var(--chip-text); text-decoration:none; }
.c-link:hover { text-decoration:underline; }

/* ── táblázatos nézet ────────────────────────────────── */
#catalog-list.as-table { display:block; overflow:auto; }
.inv-table { width:100%; border-collapse:collapse; background:var(--card-bg);
  border:1px solid var(--card-border); font-size:12.5px; }
.inv-table th, .inv-table td { padding:7px 10px; text-align:left; white-space:nowrap;
  border-bottom:1px solid var(--card-border); color:var(--text-mid); }
.inv-table th { position:sticky; top:0; z-index:2; background:var(--card-bg);
  color:var(--text-dim); font-size:10.5px; text-transform:uppercase;
  letter-spacing:.5px; cursor:pointer; user-select:none; }
.inv-table th:hover { color:var(--text-strong); }
.inv-table td.num, .inv-table th.num { text-align:right; }
.inv-table td.strong { color:var(--text-strong); font-weight:600; }
.inv-table tbody tr:hover td { background:var(--btn-hover); }
.inv-table .overdue-cell { color:var(--badge-err-text); font-weight:700; }
.inv-table .paid-cell { color:var(--badge-done-text); font-weight:700; }

/* ── Dashboard ───────────────────────────────────────── */
#dash-view {
  position:fixed; top:100px; bottom:20px; left:24px; right:24px;
  z-index:90; flex-direction:column; gap:12px; overflow-y:auto;
}
#dash-controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
#dash-kpis {
  display:grid; gap:10px;
  grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
}
.kpi {
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:11px; padding:12px 15px;
}
.kpi .k-val { color:var(--text-strong); font-size:22px; font-weight:650; }
.kpi .k-lbl { color:var(--text-dim); font-size:11.5px; margin-top:2px; }
#dash-charts {
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fit, minmax(380px, 1fr));
}
.chart {
  background:var(--card-bg); border:1px solid var(--card-border);
  border-radius:11px; padding:14px 16px;
}
.chart h4 { color:var(--text-strong); font-size:13px; margin-bottom:10px; }
.bars { display:flex; align-items:flex-end; gap:2px; height:130px; }
.bar {
  flex:1; min-width:1px; border-radius:3px 3px 0 0;
  background:var(--btn-active-bg);
  cursor:help;
}
.chart.wide { grid-column:1 / -1; }
.bar.err { background:var(--st-error); }
.bar-lbls { display:flex; justify-content:space-between; margin-top:4px;
  color:var(--text-dim); font-size:10.5px; }
.hrow { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
.hrow .h-lbl { width:130px; color:var(--text-mid); font-size:11.5px;
  text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hrow .h-bar { height:13px; border-radius:3px; background:var(--btn-active-bg); }
.hrow .h-val { color:var(--text-dim); font-size:11px; }
.dash-toggle { display:flex; align-items:center; gap:6px;
  color:var(--text-mid); font-size:12.5px; cursor:pointer; }

#legend {
  position:fixed; bottom:16px; left:24px;
  display:flex; flex-direction:column; gap:6px;
  pointer-events:none; z-index:100;
  background:var(--panel); border:1px solid var(--panel-border);
  padding:9px 12px; border-radius:10px;
}
.leg-row { display:flex; align-items:center; gap:14px; }
.leg-cap {
  font-size:10.5px; font-weight:700; letter-spacing:1px;
  text-transform:uppercase; color:var(--text-dim);
  width:64px; flex-shrink:0;
}
.leg { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-mid); }
.leg-dot { width:11px; height:11px; border-radius:50%; flex-shrink:0; }

#ver { position:fixed; bottom:16px; right:22px; color:var(--text-dim); opacity:.55; font-size:11px; z-index:100; }

#tooltip {
  position:fixed; pointer-events:none;
  background:var(--tt-bg); border:1px solid var(--tt-border);
  border-radius:10px; padding:12px 15px;
  max-width:330px; z-index:200;
  opacity:0; transition:opacity .12s;
  box-shadow:0 8px 28px var(--tt-shadow);
}
#tooltip.show { opacity:1; }
#tt-title { color:var(--text-strong); font-weight:650; font-size:14px; margin-bottom:2px; }
#tt-type  { color:var(--tt-type); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:1px; margin-bottom:7px; }
#tt-desc  { color:var(--tt-desc); font-size:12.5px; line-height:1.55; }
#tt-io    { color:var(--tt-io); font-size:12px; margin-top:7px; line-height:1.5; }

::-webkit-scrollbar { height:9px; width:9px; }
::-webkit-scrollbar-track { background:var(--scroll-track); }
::-webkit-scrollbar-thumb { background:var(--scroll-thumb); border-radius:5px; }
</style>
</head>
<body data-view="live">
<div style="font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;padding:10px 20px;background:#15181C;color:#F2F3F0;position:sticky;top:0;z-index:99999;display:flex;justify-content:space-between;align-items:center;gap:12px;">
  <a href="../index.html" style="color:#8FD3BF;text-decoration:none;">&larr; Vissza a projektekhez</a>

</div>

<div id="header">
  <h1>Számla-tracker — pipeline demó</h1>
  <p data-i18n="subHeader"></p>
  <div id="run-state"></div>
</div>

<div id="controls">
  <div id="view-switch">
    <button id="view-live"></button>
    <button id="view-runs"></button>
    <button id="view-catalog"></button>
    <button id="view-dash"></button>
  </div>
  <button id="about-btn"></button>
  <button id="lang-btn">🌐 EN</button>
  <button id="restart-btn"></button>
  <button id="error-btn"></button>
  <button id="theme-btn"></button>
</div>

<div id="about">
  <h2 data-i18n="aboutTitle"></h2>
  <p data-i18n="aboutText"></p>
</div>

<!-- LOG MOZI: futás-lista -->
<div id="runs-panel">
  <div id="runs-head">
    <h3 data-i18n="runsTitle"></h3>
    <button class="small-btn" id="runs-refresh"></button>
  </div>
  <div id="runs-list"></div>
</div>

<!-- SZÁMLÁK -->
<div id="catalog-view">
  <div id="catalog-controls">
    <input id="catalog-search" type="text">
    <select id="cat-type" class="small-btn"></select>
    <select id="cat-year" class="small-btn"></select>
    <select id="cat-month" class="small-btn"></select>
    <div id="view-switch" style="position:static">
      <button id="cat-mode-cards"></button>
      <button id="cat-mode-table"></button>
    </div>
    <label class="dash-toggle">
      <input type="checkbox" id="cat-hidepaid">
      <span id="cat-hidepaid-lbl"></span>
    </label>
    <button class="small-btn" id="cat-showpaid"></button>
    <span id="catalog-count"></span>
    <button class="small-btn" id="catalog-refresh"></button>
  </div>
  <div id="kw-chips"></div>
  <div id="catalog-list"></div>
</div>

<!-- DASHBOARD -->
<div id="dash-view">
  <div id="dash-controls">
    <select id="dash-year" class="small-btn"></select>
    <button class="small-btn" id="dash-refresh"></button>
  </div>
  <div id="dash-kpis"></div>
  <div id="dash-charts"></div>
</div>

<div id="legend">
  <div class="leg-row">
    <span class="leg-cap" data-i18n="legState"></span>
    <div class="leg"><div class="leg-dot" style="background:var(--st-pending)"></div><span data-i18n="stPending"></span></div>
    <div class="leg"><div class="leg-dot" style="background:var(--st-running)"></div><span data-i18n="stRunning"></span></div>
    <div class="leg"><div class="leg-dot" style="background:var(--st-done)"></div><span data-i18n="stDone"></span></div>
    <div class="leg"><div class="leg-dot" style="background:var(--st-error)"></div><span data-i18n="stError"></span></div>
  </div>
  <div class="leg-row">
    <span class="leg-cap" data-i18n="legType"></span>
    <div class="leg"><div class="leg-dot" style="background:var(--cat-input)"></div><span data-i18n="catInput"></span></div>
    <div class="leg"><div class="leg-dot" style="background:var(--cat-transform)"></div><span data-i18n="catTransform"></span></div>
    <div class="leg"><div class="leg-dot" style="background:var(--cat-ai)"></div><span data-i18n="catAI"></span></div>
    <div class="leg"><div class="leg-dot" style="background:var(--cat-output)"></div><span data-i18n="catOutput"></span></div>
  </div>
</div>
<div id="ver">számla-tracker · demó (szintetikus adatok)</div>

<div id="scroll-wrap">
  <div id="stage">
    <canvas id="c"></canvas>
  </div>
</div>

<div id="tooltip">
  <div id="tt-title"></div>
  <div id="tt-type"></div>
  <div id="tt-desc"></div>
  <div id="tt-io"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// KÉTNYELVŰ SZÖVEGEK (HU/EN)
// ═══════════════════════════════════════════════════════
const UI = {
  hu: {
    subHeader:'Gmail · Google Drive · Google Sheets · Claude — portfólió-demó, kizárólag szintetikus adatokkal',
    legState:'Állapot', legType:'Típus',
    stPending:'Várakozik', stRunning:'Fut', stDone:'Kész ✓', stError:'Hiba',
    catInput:'Bemenet', catTransform:'Feldolgozás', catAI:'AI', catOutput:'Kimenet',

function fmtDur(ms){
  if(ms == null || ms === '') return '';
  ms = Number(ms);
  if(Number.isNaN(ms)) return '';
  const s = ms/1000;
  const str = s >= 10 ? String(Math.round(s)) : s.toFixed(1);
  return (LANG==='hu' ? str.replace('.', ',') : str) + ' s';
}
// AI-költség: HU nézetben forintban (napi árfolyam a pillanatképből), EN-ben USD
function fmtCost(usd, decimals){
  usd = +usd || 0;
  const rate = DATA && DATA.usd_huf;
  if(LANG === 'hu' && rate){
    const huf = usd * rate;
    const str = huf >= 100 ? String(Math.round(huf))
              : huf.toFixed(1).replace('.', ',');
    return str + ' Ft';
  }
  return '$' + usd.toFixed(decimals ?? 4);
}
// számla-összegek: HUF-nál szóközös ezres tagolás, más devizánál a kód marad
function fmtAmount(v, cur){
  const n = +v;
  if(Number.isNaN(n) || v === '' || v == null) return '';
  const s = Math.round(n).toLocaleString('hu-HU').replace(/ /g,' ');
  return (cur && cur !== 'HUF') ? `${s} ${cur}` : `${s} Ft`;
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

  for(let d = 7; d >= 1; d--){
    const n = Math.floor(rnd()*3);
    const [ss, ff] = t(d, 5, 0, 2, 14000 + n*9000);
    runs.push({run_started_at:ss, run_finished_at:ff, duration_ms:14000+n*9000,
      status:'success', gmail_fetched:2+n*2, new_invoices:n, duplicates_skipped:1,
      filtered_out:1+Math.floor(rnd()*2), error_message:'',
      execution_id:'d3m0'+d+'000', node_timings:NT(3200, n*8200, n*1500, n?900:0),
      ai_input_tokens:n*2600, ai_output_tokens:n*150, ai_cost_usd:+(n*0.0071).toFixed(4)});
  }
  return {
    updated_at: now.toISOString(),
    usd_huf: 311.55, usd_huf_date: now.toISOString().slice(0,10),
    invoices, runs,
  };
}

const NODE_ORDER = ['trigger','sheets_read','gmail','type_filter','branch',
                    'pdf_fetch','pdf_text','ai_extract','drive_save',
                    'append_sheet','append_log'];
let runView = null;

function runsNewestFirst(){

}

  const runs = runsNewestFirst();

    return;
  }
  list.innerHTML = runs.map((r, i)=>{
    const ok = r.status === 'success';
    const date = (r.run_started_at||'').slice(0,16).replace('T',' ');
    return `<div class="run-item${i===selectedRunIdx?' active':''}" data-i="${i}">
      <div class="r-top">
        <div class="r-dot" style="background:var(${ok?'--st-done':'--st-error'})"></div>
        <span class="r-date">${esc(date)}</span>
        <span class="r-dur">${fmtDur(r.duration_ms)}</span>
      </div>
      <div class="r-sub">${esc(UI[LANG].nfo.parse(
        r.new_invoices||0, r.duplicates_skipped||0, r.filtered_out||0))}</div>
    </div>`;
  }).join('');
  list.querySelectorAll('.run-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      selectedRunIdx = Number(el.dataset.i);
      renderRunsList();
      startReplay(runsNewestFirst()[selectedRunIdx]);
    });
  });
}

function startReplay(run){
  let timings = {};
  try { timings = JSON.parse(run.node_timings || '{}'); } catch(e){}
  const seq = NODE_ORDER.filter(id => timings[id] != null);
  const totalReal = seq.reduce((s, id)=>s + timings[id], 0) || 1;
  const totalDisp = Math.min(9000, Math.max(3500, totalReal / 6));
  const scale = totalDisp / totalReal;
  const timeline = {};
  let t = 0;
  for(const id of seq){
    const dur = Math.max(280, timings[id] * scale);
    timeline[id] = { start:t, end:t + dur, real:timings[id] };
    t += dur;
  }
  runView = {
    run, timeline, seq, total:t, t0:performance.now(),
    missing: NODE_ORDER.filter(id => timings[id] == null),
  };
}

function runNodeInfo(run, id){
  const n = UI[LANG].nfo;
  switch(id){
    case 'gmail':        return n.levels(run.gmail_fetched||0);
    case 'type_filter':  return n.parse(run.new_invoices||0,
                                        run.duplicates_skipped||0, run.filtered_out||0);
    case 'ai_extract':   return n.aicost(run.ai_cost_usd||0);
    case 'append_sheet': return n.written(run.new_invoices||0);
    case 'append_log':   return n.runlog(run.status||'');
    default:             return '';
  }
}

function replayNodeState(id){
  const rv = runView;
  const elapsed = performance.now() - rv.t0;
  const entry = rv.timeline[id];
  if(!entry){
    if(rv.run.status === 'error' && elapsed >= rv.total &&
       rv.missing.length && rv.missing[0] === id){
      return { state:'error', info: rv.run.error_message || 'error' };
    }
    return { state:'pending', info:'' };
  }
  if(elapsed >= entry.end){
    return { state:'done', info: runNodeInfo(rv.run, id), duration_ms: entry.real };
  }
  if(elapsed >= entry.start){
    return { state:'running', info:'' };
  }
  return { state:'pending', info:'' };
}

const pad2 = n => String(n).padStart(2, '0');

// HUF-összeg egy soron (nem-HUF tételek kimaradnak az összegzésekből)
function hufAmount(r){
  if(r.penznem && r.penznem !== 'HUF') return 0;
  return +r.osszeg || 0;
}
// költség-alap: számlák ÉS nyugták, de a felszólítás nem (nem új költség)
function isSpendRow(r){ return r.type === 'szamla' || r.type === 'visszaigazolas'; }

function spendPerMonth(rows){
  const sums = {};
  rows.forEach(r=>{
    const d = String(r.email_date||'');
    if(!/^\d{4}-\d{2}/.test(d)) return;
    const k = d.slice(0,7);
    sums[k] = (sums[k]||0) + hufAmount(r);
  });
  const keys = Object.keys(sums).sort();
  if(!keys.length) return [];
  // folytonos hónap-skála a legelsőtől a legutolsóig
  const out = [];
  let [y, m] = keys[0].split('-').map(Number);
  const [ey, em] = keys[keys.length-1].split('-').map(Number);
  while(y < ey || (y === ey && m <= em)){
    const k = `${y}-${pad2(m)}`;
    out.push({label:k, value:sums[k]||0, title:fmtAmount(sums[k]||0)});
    m++; if(m > 12){ m = 1; y++; }
  }
  return out;
}

function sumBy(rows, keyFn){
  const sums = {};
  rows.forEach(r=>{
    const k = keyFn(r);
    if(!k) return;
    sums[k] = (sums[k]||0) + hufAmount(r);
  });
  return Object.entries(sums).sort((a,b)=>b[1]-a[1]);
}

function chartCard(title, inner){
  const d = document.createElement('div');
  d.className = 'chart';
  d.innerHTML = `<h4>${esc(title)}</h4>`;
  d.appendChild(inner);
  return d;
}
function vBars(items){
  const max = Math.max(1, ...items.map(i=>i.value));
  const wrap = document.createElement('div');
  const bars = document.createElement('div'); bars.className = 'bars';
  if(items.length > 50) bars.style.gap = '1px';
  items.forEach(i=>{
    const b = document.createElement('div');
    b.className = 'bar' + (i.err ? ' err' : '');
    b.style.height = Math.max(2, Math.round(100*i.value/max)) + '%';
    b.title = `${i.label}: ${i.title ?? i.value}`;
    bars.appendChild(b);
  });
  const lbl = document.createElement('div'); lbl.className = 'bar-lbls';
  lbl.innerHTML = `<span>${esc(items[0]?.label ?? '')}</span>` +
                  `<span>${esc(items[items.length-1]?.label ?? '')}</span>`;
  wrap.appendChild(bars); wrap.appendChild(lbl);
  return wrap;
}
function hBars(pairs, fmt){
  const max = Math.max(1, ...pairs.map(p=>p[1]));
  const wrap = document.createElement('div');
  pairs.forEach(([k, c])=>{
    const row = document.createElement('div'); row.className = 'hrow';
    row.innerHTML = `<span class="h-lbl" title="${esc(k)}">${esc(k)}</span>` +
      `<div class="h-bar" style="width:${Math.round(55*c/max)}%"></div>` +
      `<span class="h-val">${esc(fmt ? fmt(c) : c)}</span>`;
    wrap.appendChild(row);
  });
  return wrap;
}

function renderDash(){
  const kpiEl = document.getElementById('dash-kpis');
  if(!kpiEl) return;
  const L = UI[LANG];
  const allInv  = DATA && DATA.invoices ? DATA.invoices : [];
  const allRuns = DATA && DATA.runs ? DATA.runs : [];
  const yearSel = document.getElementById('dash-year');
  const keepY = yearSel.value;
  const ys = [...new Set([
      ...allInv.map(r=>String(r.email_date||'').slice(0,4)),
      ...allRuns.map(r=>String(r.run_started_at||'').slice(0,4)),
    ].filter(y=>/^\d{4}$/.test(y)))].sort();
  yearSel.innerHTML = `<option value="">${esc(L.yearAll)}</option>` +
    ys.map(y=>`<option>${y}</option>`).join('');
  yearSel.value = keepY;
  const Y = yearSel.value;
  const inv  = Y ? allInv.filter(r=>String(r.email_date||'').slice(0,4) === Y) : allInv;
  const runs = Y ? allRuns.filter(r=>String(r.run_started_at||'').slice(0,4) === Y) : allRuns;

  const spendRows = inv.filter(isSpendRow);
  const spend = spendRows.reduce((s, r)=>s + hufAmount(r), 0);
  const unpaid = inv.filter(r=>r.type==='szamla' && !isPaidRow(r));
  const unpaidSum = unpaid.reduce((s, r)=>s + hufAmount(r), 0);
  const today = new Date().toISOString().slice(0,10);
  const week = new Date(Date.now() + 7*864e5).toISOString().slice(0,10);
  const due7 = unpaid.filter(r=>{
    const d = String(r.fizetesi_hatarido||'');
    return d && d >= today && d <= week;
  }).length;
  const aiCost = inv.reduce((s, r)=>s + (+r.ai_cost_usd || 0), 0);

  kpiEl.innerHTML = [
    [String(inv.length), L.kpiItems],
    [fmtAmount(spend), L.kpiSpend],
    [`${unpaid.length} · ${fmtAmount(unpaidSum)}`, L.kpiUnpaid],
    [String(due7), L.kpiDue],
    [fmtCost(aiCost, 2), L.kpiCost],
    [String(runs.length), L.kpiRuns],
  ].map(([v, l]) =>
    `<div class="kpi"><div class="k-val">${esc(v)}</div>` +
    `<div class="k-lbl">${esc(l)}</div></div>`).join('');

  const charts = document.getElementById('dash-charts');
  charts.innerHTML = '';
  const spendCard = chartCard(L.chSpend, vBars(spendPerMonth(spendRows)));
  spendCard.classList.add('wide');
  charts.appendChild(spendCard);
  charts.appendChild(chartCard(L.chCat,
    hBars(sumBy(spendRows, r=>String(r.category||'')).slice(0,10)
      .map(([k, v])=>[catName(k), v]), fmtAmount)));
  charts.appendChild(chartCard(L.chVendor,
    hBars(sumBy(spendRows, r=>String(r.szolgaltato||'')).slice(0,10), fmtAmount)));
  charts.appendChild(chartCard(L.chAiCost, vBars(runs.map(r=>({
    label:(r.run_started_at||'').slice(0,10),
    value:+r.ai_cost_usd||0, err:r.status!=='success',
    title:fmtCost(+r.ai_cost_usd||0, 3) })))));
}

// ═══════════════════════════════════════════════════════
// ELRENDEZÉS + NODE-OK (a gráf)
// ═══════════════════════════════════════════════════════

function cx(col){ return X0 + col*(NW+HGAP); }

  const s = STATUS && STATUS.nodes && STATUS.nodes[id];

const sleep = ms => new Promise(r=>setTimeout(r, ms));
function setNode(id, state, info, dur){
  STATUS.nodes[id] = { state, info: info||'', duration_ms: dur ?? null };
}

let playToken = 0;
async function play(script){
  const my = ++playToken;
  let hadError = false;
  STATUS = {
    run: { status:'running', started_at:new Date().toISOString(), demo:true },
    nodes: Object.fromEntries(NODE_ORDER.map(id=>[id, {state:'pending', info:''}])),
  };
  for(const step of script){
    const t0 = performance.now();
    setNode(step.node, 'running', '');
    if(step.items){
      for(let i=1; i<=step.items; i++){
        await sleep(step.itemDur);
        if(my !== playToken) return;
        setNode(step.node, 'running', {hu:`${i}/${step.items} tétel`, en:`${i}/${step.items} items`});
      }
    } else {
      await sleep(step.dur);
      if(my !== playToken) return;
    }
    const dur = Math.round(performance.now() - t0);
    if(step.error){ hadError = true; setNode(step.node, 'error', step.info, dur); }
    else setNode(step.node, 'done', step.info, dur);
  }
  STATUS.run.status = hadError ? 'error' : 'done';
  STATUS.run.finished_at = new Date().toISOString();
  STATUS.run.summary = { rows: hadError ? 0 : 4,
    execution_id: Math.random().toString(16).slice(2, 10) };
}
play(SCRIPT_OK);

restartBtn.addEventListener('click', ()=>{ setView('live'); play(SCRIPT_OK); });
document.getElementById('error-btn').addEventListener('click',
  ()=>{ setView('live'); play(SCRIPT_ERR); });

const runStateEl = document.getElementById('run-state');

function liveRunState(){
  const L = UI[LANG];
  if(!SERVED){
    runStateEl.textContent = L.template;
    runStateEl.className = 'lost';
    return;
  }
  if(!connected || !STATUS){
    runStateEl.textContent = L.lost;
    runStateEl.className = 'lost';
    restartBtn.disabled = true;
    return;
  }
  const run = STATUS.run;
  const demo = run.demo ? L.demoTag : '';
  if(run.status === 'running'){
    const secs = Math.max(0, Math.round((Date.now() - Date.parse(run.started_at))/1000));
    runStateEl.textContent = L.running(secs) + demo;
    runStateEl.className = 'running';
    restartBtn.disabled = true;
  } else {
    const isDone = run.status === 'done';
    let extra = '';
    if(run.summary && run.summary.rows != null){
      extra += ` · ${run.summary.rows} ${L.rowsUnit}`;
    }
    if(run.finished_at){
      extra += ' · ' + fmtDur(Date.parse(run.finished_at) - Date.parse(run.started_at));
    }
    if(run.summary && run.summary.execution_id){
      extra += ` · run ${run.summary.execution_id}`;
    }
    runStateEl.textContent = (isDone ? L.done : L.error) + extra + demo;
    runStateEl.className = isDone ? 'done' : 'error';
    restartBtn.disabled = false;
  }
}

function runsRunState(){
  const L = UI[LANG];
  if(!runView){
    runStateEl.textContent = L.runsPick;
    runStateEl.className = 'lost';
    return;
  }
  const elapsed = performance.now() - runView.t0;
  if(elapsed < runView.total){
    runStateEl.textContent = L.replaying;
    runStateEl.className = 'running';
    return;
  }
  const r = runView.run;
  const ok = r.status === 'success';
  const date = (r.run_started_at||'').slice(0,16).replace('T',' ');
  let s = `${date} · ${ok ? L.done : L.error} · ${r.new_invoices||0} ${L.rowsUnit} · ${fmtDur(r.duration_ms)}`;
  if(r.execution_id) s += ` · ${L.run} ${String(r.execution_id).slice(0,8)}`;
  runStateEl.textContent = s;
  runStateEl.className = ok ? 'done' : 'error';
}

function updateRunState(){
  if(VIEW === 'runs'){ runsRunState(); return; }
  if(VIEW === 'catalog' || VIEW === 'dash'){
    const n = DATA && DATA.invoices ? DATA.invoices.length : 0;
    runStateEl.textContent = UI[LANG].items(n);
    runStateEl.className = '';
    return;
  }
  liveRunState();
}

const W = Math.max(...NODES.map(n=>n.x)) + NW + 70;
const H = Math.max(...NODES.map(n=>n.y)) + NH + 100;
const DPR = window.devicePixelRatio || 1;
canvas.width  = W * DPR;
canvas.height = H * DPR;
canvas.style.width  = W + 'px';
canvas.style.height = H + 'px';

let hoveredNode = null;
canvas.addEventListener('mousemove', e=>{
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  let found = null;
  NODES.forEach(n=>{ if(mx>=n.x && mx<=n.x+NW && my>=n.y && my<=n.y+NH) found=n; });
  hoveredNode = found;
  if(found){
    const st = nodeState(found.id);
    const L = UI[LANG];
    document.getElementById('tt-title').textContent = txt(found.label);
    document.getElementById('tt-type').textContent  = txt(found.sub) + ' · ' + (L.states[st.state] || st.state)
      + (st.duration_ms != null ? ' · ' + fmtDur(st.duration_ms) : '');
    document.getElementById('tt-desc').textContent  = txt(found.desc);
    document.getElementById('tt-io').textContent    = st.info ? (L.result + txt(st.info)) : txt(found.io);
    let tx = e.clientX+16, ty = e.clientY+10;
    if(tx+340>innerWidth)  tx = e.clientX-350;
    if(ty+180>innerHeight) ty = e.clientY-180;
    tip.style.left = tx+'px'; tip.style.top = ty+'px';
    tip.classList.add('show');
  } else tip.classList.remove('show');
});
canvas.addEventListener('mouseleave',()=>tip.classList.remove('show'));

let dragging=false, dragX=0, dragY=0, sX=0, sY=0;
wrap.addEventListener('mousedown',e=>{ dragging=true; dragX=e.clientX; dragY=e.clientY; sX=wrap.scrollLeft; sY=wrap.scrollTop; });
window.addEventListener('mousemove',e=>{ if(!dragging)return; wrap.scrollLeft=sX-(e.clientX-dragX); wrap.scrollTop=sY-(e.clientY-dragY); });
window.addEventListener('mouseup',()=>dragging=false);

// ÚTVONALAK + ADATCSOMAGOK

function nodeById(id){ return NODES.find(n=>n.id===id); }

function routePipe(p){
  const a = nodeById(p.from), b = nodeById(p.to);
  if(!a||!b) return null;
  const ax = a.x + NW, ay = a.y + NH/2;
  const bx = b.x,      by = b.y + NH/2;
  const mx = (ax+bx)/2;
  return { ax,ay,bx,by, c1x:mx,c1y:ay, c2x:mx,c2y:by };
}
function bezPt(r,t){
  const {ax,ay,bx,by,c1x,c1y,c2x,c2y}=r;
  return {
    x:(1-t)**3*ax+3*(1-t)**2*t*c1x+3*(1-t)*t*t*c2x+t**3*bx,
    y:(1-t)**3*ay+3*(1-t)**2*t*c1y+3*(1-t)*t*t*c2y+t**3*by,
  };
}

const pkts = PIPES.map(p=>[
  { pipe:p, t:Math.random(),    speed:.004+Math.random()*.003 },
  { pipe:p, t:Math.random()*.5, speed:.004+Math.random()*.003 },
]).flat();

function pipeActive(p){
  const fs = nodeState(p.from).state, ts = nodeState(p.to).state;
  return fs==='done' && (ts==='running' || ts==='done' || ts==='error');
}

// ═══════════════════════════════════════════════════════
// RAJZOLÁS
// ═══════════════════════════════════════════════════════
function wrapInfo(text, maxChars){
  if(!text) return [];
  if(text.length<=maxChars) return [text];
  let cut = text.lastIndexOf(' ', maxChars);
  if(cut<10) cut = maxChars;
  let rest = text.slice(cut+1);
  if(rest.length>maxChars) rest = rest.slice(0,maxChars-1)+'…';
  return [text.slice(0,cut), rest];
}

let frame=0;

function drawNode(n){
  const th  = T();
  const catCol = th.cat[n.cat];
  const st  = nodeState(n.id);
  const hover = n===hoveredNode;
  const pending = st.state==='pending';
  ctx.save();

  if(th.glow && !pending){
    ctx.shadowColor = st.state==='running' ? th.running
                    : st.state==='error'   ? th.error : catCol;
    ctx.shadowBlur  = hover ? 18 : 10;
  } else {
    ctx.shadowColor = hover ? th.cardShadowHover : th.cardShadow;
    ctx.shadowBlur  = hover ? 14 : 7;
    ctx.shadowOffsetY = 2;
  }
  ctx.fillStyle = st.state==='running' ? th.runningFill
                : st.state==='error'   ? th.errorFill
                : th.cardFill;
  ctx.beginPath(); ctx.roundRect(n.x, n.y, NW, NH, 9); ctx.fill();
  ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;

  ctx.lineWidth = st.state==='running' ? 2.4 : 1.4;
  ctx.strokeStyle = pending ? th.pendingBorder
                  : st.state==='running' ? th.running
                  : st.state==='error'   ? th.error
                  : catCol;
  ctx.beginPath(); ctx.roundRect(n.x, n.y, NW, NH, 9); ctx.stroke();

  if(st.state==='running'){
    const pulse = 0.25+0.35*Math.abs(Math.sin(frame*.06));
    ctx.strokeStyle = th.glow ? `rgba(255,187,51,${pulse})` : `rgba(232,162,0,${pulse})`;
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.roundRect(n.x-4, n.y-4, NW+8, NH+8, 12); ctx.stroke();
  }

  ctx.fillStyle = pending ? th.pendingBar : catCol;
  ctx.beginPath(); ctx.roundRect(n.x, n.y, 5, NH, [9, 0, 0, 9]); ctx.fill();

  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = pending ? th.titlePending : th.title;
  ctx.font = '600 13.5px "Segoe UI", system-ui, sans-serif';
  ctx.fillText(txt(n.label), n.x+15, n.y+25);
  ctx.fillStyle = pending ? th.subPending : th.sub;
  ctx.font = '12px "Segoe UI", system-ui, sans-serif';
  ctx.fillText(txt(n.sub), n.x+15, n.y+44);
  ctx.restore();

  const bx = n.x+NW-4, by = n.y+4;
  const badgeRing = T().cardFill;
  if(st.state==='done'){
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, 11, 0, Math.PI*2);
    ctx.fillStyle=T().done; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=badgeRing; ctx.stroke();
    ctx.strokeStyle = T().glow ? '#04140b' : '#ffffff';
    ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(bx-5, by);
    ctx.lineTo(bx-1.5, by+3.8);
    ctx.lineTo(bx+5.2, by-3.8);
    ctx.stroke();
    ctx.restore();
  }
  if(st.state==='error'){
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, 11, 0, Math.PI*2);
    ctx.fillStyle=T().error; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=badgeRing; ctx.stroke();
    ctx.strokeStyle = T().glow ? '#1c040b' : '#ffffff';
    ctx.lineWidth=2.6; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(bx-4, by-4); ctx.lineTo(bx+4, by+4);
    ctx.moveTo(bx+4, by-4); ctx.lineTo(bx-4, by+4);
    ctx.stroke();
    ctx.restore();
  }
  if(st.state==='running'){
    ctx.save();
    ctx.beginPath(); ctx.arc(bx, by, 11, 0, Math.PI*2);
    ctx.fillStyle=T().running; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=badgeRing; ctx.stroke();
    ctx.strokeStyle = T().glow ? '#1c1403' : '#ffffff';
    ctx.lineWidth=2.4; ctx.lineCap='round';
    const a0 = frame*.12;
    ctx.beginPath(); ctx.arc(bx, by, 5, a0, a0+Math.PI*1.35); ctx.stroke();
    ctx.restore();
  }

  let infoText = txt(st.info);
  if((st.state==='done' || st.state==='error') && st.duration_ms != null){
    infoText = infoText ? infoText + ' · ' + fmtDur(st.duration_ms)
                        : fmtDur(st.duration_ms);
  }
  if(infoText){
    ctx.save();
    ctx.fillStyle = st.state==='error'   ? T().infoErr
                  : st.state==='running' ? T().infoRun
                  : T().infoDone;
    ctx.font = '600 12px "Segoe UI", system-ui, sans-serif';
    wrapInfo(infoText, 32).forEach((line,i)=>{
      ctx.fillText(line, n.x+15, n.y+NH+18+i*16);
    });
    ctx.restore();
  }
}

function drawPipeShape(p){
  const r=routePipe(p); if(!r) return;
  const th = T();
  const active = pipeActive(p);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(r.ax,r.ay);
  ctx.bezierCurveTo(r.c1x,r.c1y,r.c2x,r.c2y,r.bx,r.by);
  ctx.strokeStyle = active ? th.pipeActive : th.pipe;
  ctx.lineWidth = active ? 2.6 : 1.6;
  if(p.dashed) ctx.setLineDash([5,6]); else ctx.setLineDash([]);
  ctx.stroke(); ctx.setLineDash([]);
  const angle = Math.atan2(r.by-r.c2y, r.bx-r.c2x);
  ctx.translate(r.bx,r.by); ctx.rotate(angle);
  ctx.fillStyle = active ? th.pipeActive : th.arrow;
  ctx.beginPath(); ctx.moveTo(1,0); ctx.lineTo(-8,-4.5); ctx.lineTo(-8,4.5); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPkt(pk){
  if(!pipeActive(pk.pipe)) return;
  const r=routePipe(pk.pipe); if(!r) return;
  const th = T();
  const pt=bezPt(r,pk.t);
  ctx.save();
  if(th.glow){ ctx.shadowColor=th.pkt; ctx.shadowBlur=9; }
  ctx.beginPath(); ctx.arc(pt.x,pt.y,4,0,Math.PI*2);
  ctx.fillStyle=th.pkt;
  ctx.fill();
  ctx.shadowBlur=0;
  ctx.lineWidth=1.5; ctx.strokeStyle=th.pktStroke; ctx.stroke();
  ctx.restore();
}

function rowLabel(text, y){
  ctx.fillStyle=T().rowLabel;
  ctx.font='600 11px "Segoe UI", system-ui, sans-serif';
  ctx.fillText(text.toUpperCase().split('').join(' '), X0, y);
}

function draw(){
  const th = T();
  const rows = UI[LANG].rows;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=th.bg; ctx.fillRect(0,0,W,H);

  rowLabel(rows.top, ROW_TOP-NH/2-18);
  rowLabel(rows.mid, ROW_MID-NH/2-18);
  rowLabel(rows.bot, ROW_BOT-NH/2-18);

  PIPES.forEach(drawPipeShape);
  pkts.forEach(pk=>{ pk.t+=pk.speed; if(pk.t>1) pk.t=0; drawPkt(pk); });
  NODES.forEach(drawNode);

  if(frame%15===0) updateRunState();
  frame++;
  requestAnimationFrame(draw);
}

// ── indulás ───────────────────────────────────────────
applyLang();
applyTheme();
applyCatMode();
setView(VIEW);
if(SERVED) loadData(false);
draw();
</script>
