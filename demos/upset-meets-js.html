<main>
<header class="hero">
  <p class="eyebrow" data-hu="Vizualizáció · anonimizált · kitalált adat" data-en="Visualisation · anonymised · synthetic data"></p>
  <h1>UpSet meets JS</h1>
  <p class="lead" data-hu="Halmazábrázolás akkor, amikor a Venn-diagram már nem elég. Az UpSet a metszeteket oszlopokba rendezi: egy oszlop egy kombináció, a magassága a mennyiség, a pontok pedig megmondják, melyik halmazok találkoznak. Ez az oldal a logikát hoverrel tanítja — a kiemelés mindig azt mondja, milyen nézetet látsz." data-en="Set visualisation for when a Venn diagram is no longer enough. UpSet lines the intersections up as columns: one column is one combination, its height is the quantity, and the dots say which sets meet. This page teaches the logic by hover — the highlight always tells you which view you are looking at."></p>
  <div class="banner">
    <h4 data-hu="Ezen az oldalon minden szám kitalált" data-en="Every number on this page is synthetic"></h4>
    <p data-hu="A tagság-mátrixokat fix magú generátor állította elő, a metszeteket utána összeszámoltuk — ugyanaz a pipeline, mint egy éles aggregálásnál. Üzleti tartalom nem következtethető ki belőlük. Az UpSet ebben a projektben nem volt éles eszköz; a bemutató a forma miatt készült." data-en="The membership matrices were produced by a fixed-seed generator, then the intersections were counted — the same pipeline as a live aggregation. No business content can be inferred. UpSet was not a production tool on this project; the page exists to show the form."></p>
  </div>
  <div class="kpis">
    <div class="kpi"><b id="kpi-sets">6</b><span data-hu="halmaz — a Venn itt már olvashatatlan" data-en="sets — Venn is already unreadable here"></span></div>
    <div class="kpi"><b id="kpi-combos">63</b><span data-hu="lehetséges nemüres metszet" data-en="possible non-empty intersections"></span></div>
    <div class="kpi"><b id="kpi-shown">16</b><span data-hu="oszlop elég a domináns együttállásokhoz" data-en="columns cover the dominant combinations"></span></div>
    <div class="kpi"><b>hover</b><span data-hu="megmondja, milyen nézetet látsz" data-en="tells you which view you are seeing"></span></div>
  </div>
</header>

<section id="miez">
  <p class="eyebrow" data-hu="01 · Mi ez" data-en="01 · What it is"></p>
  <h2 data-hu="A metszetek listája, nem a körök játéka" data-en="A list of intersections, not a game of circles"></h2>
  <p class="sub" data-hu="Alexander Lex és szerzőtársai 2014-ben publikálták az UpSetet: a halmazokat sorokba, a metszeteket oszlopokba tették. A forma onnan erős, hogy <strong>nem a síkidomok metszetét</strong> kell kiolvasni, hanem egy mátrixot — ugyanazt a nyelvet, amit egy táblázatnál már ismersz." data-en="Alexander Lex and colleagues published UpSet in 2014: sets as rows, intersections as columns. The form is strong because you do not have to read <strong>overlapping shapes</strong>, but a matrix — the same language you already know from a table."></p>
  <div class="grid2">
    <div class="card">
      <h3 data-hu="Amit megmutat" data-en="What it shows"></h3>
      <p class="small" data-hu="Melyik kombináció milyen gyakori. Nem csak azt, hogy A mekkora, hanem azt is, hogy A-ból mennyi van egyedül, mennyi B-vel, mennyi B-vel és C-vel. Ez a különbség a halmazméret és a metszetméret között." data-en="Which combination is how frequent. Not only how large A is, but how much of A is alone, how much sits with B, how much with B and C. That is the difference between set size and intersection size."></p>
    </div>
    <div class="card">
      <h3 data-hu="Amit a Venn elveszít" data-en="What Venn loses"></h3>
      <p class="small" data-hu="Két-három kör még olvasható. Négynél a síkidomok száma 15, ötnél 31, hatnál 63. A terület már nem arányos, a címkék egymásra másznak, és a ritka, de fontos együttállás eltűnik a közepén." data-en="Two or three circles stay readable. At four the regions number 15, at five 31, at six 63. Area is no longer proportional, labels pile up, and the rare but important combination vanishes in the middle."></p>
    </div>
  </div>
</section>

<section id="venn">
  <p class="eyebrow" data-hu="02 · A Venn határa" data-en="02 · Where Venn fails"></p>
  <h2 data-hu="Add hozzá a következő kört" data-en="Add the next circle"></h2>
  <p class="sub" data-hu="Ugyanaz a hárombetűs példa, egyre több halmazzal. Kettőnél a Venn a természetes választás. Ötnél már nem ábra, hanem dísz." data-en="The same lettered example, with more sets each time. At two, Venn is the natural choice. At five it is decoration, not a chart."></p>
  <div class="chips" id="vennchips" style="margin:0 0 14px"></div>
  <div class="grid2">
    <div class="chart">
      <h4 id="venntitle"></h4>
      <div id="vennbox"></div>
      <p class="cap" id="venncap"></p>
    </div>
    <div class="card">
      <h3 data-hu="Hány régiót kellene kiolvasni?" data-en="How many regions would you have to read?"></h3>
      <p class="small" data-hu="Nemüres metszetek száma: 2<sup>k</sup> − 1. A Venn mindegyiket egy síkidomba gyömöszöli. Az UpSet csak a nagyokat rakja ki oszlopnak — a farok a táblában marad." data-en="Non-empty intersections: 2<sup>k</sup> − 1. Venn stuffs every one of them into a region. UpSet only stands the large ones up as columns — the tail stays in a table."></p>
      <div class="tablewrap" style="margin-top:10px"><table id="regiontable"></table></div>
    </div>
  </div>
</section>

<section id="anatomia">
  <p class="eyebrow" data-hu="03 · Anatómia" data-en="03 · Anatomy"></p>
  <h2 data-hu="Először a papírforma" data-en="First the print form"></h2>
  <p class="sub" data-hu="Három halmaz, mind a hét metszet — így néz ki a klasszikus UpSet: az oszlop a mennyiség, a pont a tagság, a sáv a halmazméret. Nyomtatásban ennyi az egész: magadnak kell összerakni, melyik oszlop mit jelent." data-en="Three sets, all seven intersections — this is the classic UpSet: the column is the quantity, the dots are membership, the side bar is set size. In print that is the whole chart: you have to assemble for yourself what each column means."></p>
  <div class="chart">
    <h4 data-hu="Klasszikus UpSet — minden metszet kint van" data-en="Classic UpSet — every intersection is on the chart"></h4>
    <div id="classicchart" class="ubox classic"></div>
    <p class="cap" data-hu="A metszet <em>kizárólagos</em>: az oszlop azoké, akik pontosan ezekben a halmazokban vannak. A ∩ B itt nem tartalmazza az A ∩ B ∩ C-t — az külön oszlop, 12 elemmel." data-en="Intersections are <em>exclusive</em>: a column is the people who sit in exactly these sets. A ∩ B here does not include A ∩ B ∩ C — that is its own column, with 12 items."></p>
  </div>
  <div class="verdict" style="margin-top:16px">
    <h3 data-hu="A hover a magyarázat" data-en="Hover is the explanation"></h3>
    <p data-hu="Statikus ábrán az UpSet elsőre idegen: a pontok és az oszlopok ott vannak, a mondat nincs. JavaScripttel a kiemelés megmondja, oszlopot, sort vagy cellát látsz-e. Ettől lesz tanítható a forma — ez az, amit a „meets JS” a címben jelent." data-en="On a static figure UpSet looks alien at first: the dots and columns are there, the sentence is not. With JavaScript the highlight tells you whether you are looking at a column, a row or a cell. That is what makes the form teachable — and what “meets JS” means in the title."></p>
  </div>
  <h3 style="margin:28px 0 8px" data-hu="Hoverold a logikát" data-en="Hover the logic"></h3>
  <p class="sub" data-hu="Ugyanaz a három halmaz, ugyanaz a hét oszlop. Vidd az egeret egy oszlopra, egy sorra, egy pontra vagy egy sávra. A zöld doboz mindig azt mondja ki, <strong>milyen nézetet látsz</strong> — ez az UpSet olvasási szabálya." data-en="The same three sets, the same seven columns. Hover a column, a row, a dot or a bar. The green box always states <strong>which view you are looking at</strong> — that is the reading rule of UpSet."></p>
  <div class="chart">
    <h4 data-hu="Ugyanaz a mátrix, most hoverrel" data-en="The same matrix, now with hover"></h4>
    <div id="anatochart" class="ubox"></div>
    <p class="cap" data-hu="A színek a sorokból jönnek. A kiemelés nem dísz: megmondja, éppen oszlopot, sort vagy cellát olvasol." data-en="The colours come from the rows. The highlight is not decoration: it tells you whether you are reading a column, a row or a cell."></p>
  </div>
  <div class="explain" id="anatoexplain"></div>
  <div class="readout" id="anatoread"></div>
</section>

<section id="mikor">
  <p class="eyebrow" data-hu="04 · Mikor" data-en="04 · When"></p>
  <h2 data-hu="Akkor, ha a kombináció a kérdés" data-en="When the combination is the question"></h2>
  <div class="grid2fixed" style="margin-top:8px">
    <div class="card yesno yes">
      <p class="tag" data-hu="Használd, ha" data-en="Use it when"></p>
      <h3 data-hu="Négy vagy több halmaz átfedése számít" data-en="The overlap of four or more sets matters"></h3>
      <p data-hu="Csatornák, jogosultságok, tünetek, termékmodulok, címkék. A kérdés nem a „mennyi van A-ban”, hanem a „kik azok, akik A-ban és B-ben benne vannak, C-ben viszont nem”." data-en="Channels, permissions, symptoms, product modules, tags. The question is not “how many in A”, but “who is in A and B but not in C”."></p>
    </div>
    <div class="card yesno yes">
      <p class="tag" data-hu="Használd, ha" data-en="Use it when"></p>
      <h3 data-hu="A ritka együttállás is döntés" data-en="A rare combination is still a decision"></h3>
      <p data-hu="A Venn közepén eltűnik a kis régió. Az UpSetben a kis oszlop is oszlop: látszik, hogy létezik, és az is, hogy kicsi. A kampány sokszor pont ezekre a keskeny metszetekre megy." data-en="In the middle of a Venn the small region vanishes. In UpSet a small column is still a column: you see that it exists, and that it is small. Campaigns often target exactly these narrow intersections."></p>
    </div>
    <div class="card yesno no">
      <p class="tag" data-hu="Ne használd, ha" data-en="Do not use it when"></p>
      <h3 data-hu="Kettő vagy három halmazod van" data-en="You have two or three sets"></h3>
      <p data-hu="Ott a Venn gyorsabb és ismerősebb. Az UpSet ilyenkor túl gép, a forma többet kér, mint amennyit a kérdés megér." data-en="There a Venn is faster and more familiar. UpSet is then too much machinery: the form asks more than the question is worth."></p>
    </div>
    <div class="card yesno no">
      <p class="tag" data-hu="Ne használd, ha" data-en="Do not use it when"></p>
      <h3 data-hu="A kérdés áramlás vagy idő" data-en="The question is a flow or a time series"></h3>
      <p data-hu="Honnan hova megy a mennyiség: Sankey. Egy mutató időben: vonal. Rangsor: oszlop. Az UpSet halmaztagságot mutat egy pillanatban, nem mozgást." data-en="Where a quantity goes: a Sankey. One metric over time: a line. A ranking: a bar. UpSet shows set membership at a moment, not movement."></p>
    </div>
  </div>
</section>

<section id="peldak">

function drawUpset(spec, hover, opts) {
  opts = opts || {};
  let inters = sortInters(spec, opts.sort || "size");

  if (focusSet !== null) inters = inters.filter(it => it.members.indexOf(focusSet) >= 0);

    });

    const x = ml + ci * colW + colW / 2;
    const bh = Math.max(3, (topH - 28) * it.n / mxI);

      fmtInt(it.n) + "</text>";
  });

    const y = topH + 14 + si * rowH + rowH / 2;
    const bw = Math.max(3, barW * st.n / mxS);
    const x1 = nameW + barW - bw;
    s += '<text class="hit" data-kind="set" data-i="' + si + '" x="' + (nameW - 8) + '" y="' +
      (y + 4) + '" text-anchor="end" font-size="11.5" fill="#15181C">' + esc(sn(st)) + "</text>";
    s += '<rect class="hit" data-kind="sbar" data-i="' + si + '" x="' + x1 + '" y="' + (y - 6) +

    s += '<text class="slab" data-kind="sbar" data-i="' + si + '" x="' + (nameW + barW + 6) + '" y="' +
      (y + 4) + '" text-anchor="start" font-size="9.5" fill="#6E7480">' + fmtInt(st.n) + "</text>";
  });

  inters.forEach((it, ci) => {
    const x = ml + ci * colW + colW / 2;
    const mem = it.members;
    s += '<rect class="hit" data-kind="combo" data-i="' + ci + '" x="' + (x - colW / 2) +
      '" y="' + (topH + 6) + '" width="' + colW + '" height="' + (nS * rowH + 4) +
      '" fill="#fff" opacity="0"></rect>';

        on = !!(inters[ci] && inters[ci].members.indexOf(i) >= 0);
      } else {
        on = (hover && hover.i === i) || focusSet === i;
      }
      if (kind === "set") n.setAttribute("font-weight", on && any ? "600" : "400");
    }
    if (kind === "link") n.style.opacity = !any ? "0.55" : (on ? "0.75" : "0.08");
    else n.style.opacity = !any ? "1" : (on ? "1" : "0.14");
  });
}

function emptyExplain() {
  return {
    tag: L("nézet", "view"),
    text: L(
      "Vidd az egeret egy oszlopra, egy sorra, egy pontra vagy egy sávra. A kiemelés megmutatja, milyen nézetet látsz.",
      "Hover a column, a row, a dot or a bar. The highlight shows which view you are looking at."
    ),
    cells: []
  };
}

function explain(spec, hover, inters, extra) {
  extra = extra || {};
  if (extra.focusSet !== null && extra.focusSet !== undefined && !hover) {
    const st = spec.sets[extra.focusSet];
    const nCol = inters.filter(it => it.members.indexOf(extra.focusSet) >= 0).length;
    return {
      tag: L("nézet · halmazra szűrve", "view · filtered to a set"),
      text: L(
        "Csak azok az oszlopok maradtak, amelyekben ez a halmaz — " + sn(st) + " — részt vesz. A többi kombináció el van rejtve: nem tűnt el az adatból, csak a nézetből.",
        "Only columns that include this set — " + sn(st) + " — remain. The other combinations are hidden: not gone from the data, only from the view."
      ),
      cells: [
        { k: L("halmaz", "set"), v: esc(sn(st)) },
        { k: L("halmazméret", "set size"), v: fmtInt(st.n) },
        { k: L("látható oszlop", "visible columns"), v: fmtInt(nCol) }
      ]
    };
  }
  if (!hover) return emptyExplain();

  if (hover.kind === "combo" || hover.kind === "ibar") {
    const it = inters[hover.i];
    const neg = comboNeg(spec, it);
    const formula = comboName(spec, it) + (neg ? " ∩ " + neg : "");
    return {
      tag: L("nézet · metszet-oszlop", "view · intersection column"),
      text: L(
        "Ez az oszlop azoké, akik <strong>pontosan</strong> ezekben a halmazokban vannak. A függőleges vonal a kitöltött pontokat köti össze. A sáv magassága a mennyiség.",
        "This column is the people who sit in <strong>exactly</strong> these sets. The vertical line joins the filled dots. Bar height is the quantity."
      ),
      cells: [
        { k: L("kombináció", "combination"), v: esc(formula) },
        { k: L("fokszám", "degree"), v: fmtInt(it.degree) },
        { k: spec.unit_hu ? L(spec.unit_hu, spec.unit_en) : L("elemszám", "count"), v: fmtInt(it.n) },
        { k: L("a kohorszban", "of the cohort"), v: pct(it.n / spec.universe, 1) }
      ]
    };
  }
  if (hover.kind === "set" || hover.kind === "sbar") {
    const st = spec.sets[hover.i];
    const nCol = inters.filter(it => it.members.indexOf(hover.i) >= 0).length;
    return {
      tag: L("nézet · halmazsor", "view · set row"),
      text: L(
        "A vízszintes sáv a <strong>halmaz teljes mérete</strong> — mindenki, aki benne van, a többi halmaztól függetlenül. Ezért nagyobb, mint bármelyik oszlop, amelyben részt vesz.",
        "The horizontal bar is the <strong>full set size</strong> — everyone in it, regardless of the other sets. That is why it is larger than any column it takes part in."
      ),
      cells: [
        { k: L("halmaz", "set"), v: esc(sn(st)) },
        { k: L("halmazméret", "set size"), v: fmtInt(st.n) },
        { k: L("oszlopban szerepel", "appears in columns"), v: fmtInt(nCol) },
        { k: L("a kohorszban", "of the cohort"), v: pct(st.n / spec.universe, 1) }
      ]
    };
  }
  if (hover.kind === "dot") {
    const st = spec.sets[hover.set];
    const it = inters[hover.combo];
    const on = hover.on;
    return {
      tag: on ? L("nézet · kitöltött pont", "view · filled dot") : L("nézet · üres pont", "view · empty dot"),
      text: on
        ? L(
          "A kitöltött pont azt jelenti: ez a halmaz — <strong>" + esc(sn(st)) + "</strong> — <em>benne van</em> ebben a kombinációban. Az oszlop színe a sorokból áll össze.",
          "A filled dot means <strong>" + esc(sn(st)) + "</strong> <em>is in</em> this combination. The column is assembled from its rows."
        )
        : L(
          "Az üres pont azt jelenti: ez a halmaz — <strong>" + esc(sn(st)) + "</strong> — <em>nincs benne</em> ebben a kombinációban. Akik ebben az oszlopban vannak, ebből a halmazból kimaradtak.",
          "An empty dot means <strong>" + esc(sn(st)) + "</strong> is <em>not in</em> this combination. The people in this column were left out of that set."
        ),
      cells: [
        { k: L("halmaz", "set"), v: esc(sn(st)) },
        { k: L("kombináció", "combination"), v: esc(comboName(spec, it)) },
        { k: L("tagság", "membership"), v: on ? L("benne", "in") : L("nincs benne", "not in") },
        { k: L("oszlop mérete", "column size"), v: fmtInt(it.n) }
      ]
    };
  }
  return emptyExplain();
}

function paintExplain(idE, idR, info) {
  el(idE).innerHTML = '<p class="tag">' + esc(info.tag) + "</p><p>" + info.text + "</p>";
  if (!info.cells.length) {
    el(idR).innerHTML = '<div class="cell wide"><div class="k">' + esc(L("olvasás", "reading")) +
      '</div><div class="v soft">' + esc(L("Még nincs kijelölés.", "Nothing selected yet.")) + "</div></div>";
    return;
  }
  el(idR).innerHTML = info.cells.map(c =>
    '<div class="cell"><div class="k">' + esc(c.k) + '</div><div class="v">' + c.v + "</div></div>"
  ).join("");
}

function bindUpset(boxId, onHover, onSet) {
  const root = el(boxId);
  root.onpointerover = ev => {
    const n = ev.target.closest("[data-kind]");
    if (!n) return;
    const kind = n.getAttribute("data-kind");
    const hover = { kind: kind };
    if (kind === "combo" || kind === "ibar" || kind === "set" || kind === "sbar") hover.i = +n.getAttribute("data-i");
    if (kind === "dot") {
      hover.combo = +n.getAttribute("data-combo");
      hover.set = +n.getAttribute("data-set");
      hover.on = n.getAttribute("data-on") === "1";
    }
    onHover(hover);
  };
  root.onpointerleave = () => onHover(null);
  root.onclick = ev => {
    const n = ev.target.closest("[data-kind]");
    if (!n || !onSet) return;
    const kind = n.getAttribute("data-kind");
    if (kind === "set" || kind === "sbar") onSet(+n.getAttribute("data-i"));
  };
}

/* ---------- Venn ---------- */
function renderVenn() {
  const n = state.venn;
  el("vennchips").innerHTML = [2, 3, 4, 5, 6].map(k =>
    '<button type="button" class="chip" data-venn="' + k + '" aria-pressed="' + (n === k) + '">' +
    k + " " + L("halmaz", "sets") + "</button>"
  ).join("");
  const regs = Math.pow(2, n) - 1;
  el("venntitle").textContent = n + " " + L("halmaz, Venn-szerű átfedés", "sets, Venn-like overlap");
  el("venncap").textContent = n <= 3
    ? L("Még olvasható: a régiók szétesnek, a címkéknek van helyük.", "Still readable: the regions separate, the labels have room.")
    : L(
      regs + " régiót kellene megkülönböztetni. A terület már nem mennyiség, a címke pedig találgatás.",
      regs + " regions to tell apart. Area is no longer quantity, and the label is a guess."
    );

  const W = 420, H = 280;
  const cols = ["#378ADD", "#1D9E75", "#EF9F27", "#D85A30", "#1F6F5C", "#7B6BA8"];
  const labs = ["A", "B", "C", "D", "E", "F"];
  const layout = {
    2: [{ cx: 168, cy: 140, r: 78 }, { cx: 252, cy: 140, r: 78 }],
    3: [{ cx: 175, cy: 118, r: 72 }, { cx: 245, cy: 118, r: 72 }, { cx: 210, cy: 178, r: 72 }],
    4: [
      { cx: 168, cy: 118, rx: 88, ry: 52, rot: -35 },
      { cx: 230, cy: 118, rx: 88, ry: 52, rot: 35 },
      { cx: 168, cy: 168, rx: 88, ry: 52, rot: 35 },
      { cx: 230, cy: 168, rx: 88, ry: 52, rot: -35 }
    ],
    5: [
      { cx: 210, cy: 96, rx: 92, ry: 46, rot: 0 },
      { cx: 262, cy: 132, rx: 92, ry: 46, rot: 72 },
      { cx: 242, cy: 190, rx: 92, ry: 46, rot: 144 },
      { cx: 178, cy: 190, rx: 92, ry: 46, rot: 216 },
      { cx: 158, cy: 132, rx: 92, ry: 46, rot: 288 }
    ],
    6: [
      { cx: 210, cy: 92, rx: 90, ry: 40, rot: 0 },
      { cx: 268, cy: 124, rx: 90, ry: 40, rot: 60 },
      { cx: 268, cy: 184, rx: 90, ry: 40, rot: 120 },
      { cx: 210, cy: 216, rx: 90, ry: 40, rot: 180 },
      { cx: 152, cy: 184, rx: 90, ry: 40, rot: 240 },
      { cx: 152, cy: 124, rx: 90, ry: 40, rot: 300 }
    ]
  };
  let s = "";
  layout[n].forEach((c, i) => {
    const op = n <= 3 ? 0.28 : 0.2;
    if (c.r) {
      s += '<circle cx="' + c.cx + '" cy="' + c.cy + '" r="' + c.r + '" fill="' + cols[i] +
        '" opacity="' + op + '" stroke="' + cols[i] + '" stroke-width="1.5"/>';
    } else {
      s += '<ellipse cx="' + c.cx + '" cy="' + c.cy + '" rx="' + c.rx + '" ry="' + c.ry +
        '" fill="' + cols[i] + '" opacity="' + op + '" stroke="' + cols[i] +
        '" stroke-width="1.4" transform="rotate(' + c.rot + " " + c.cx + " " + c.cy + ')"/>';
    }
  });
  if (n === 2) {
    s += '<text x="132" y="136" font-size="13" fill="#15181C">A</text>';
    s += '<text x="276" y="136" font-size="13" fill="#15181C">B</text>';
    s += '<text x="204" y="144" text-anchor="middle" font-size="11" fill="#15181C">A∩B</text>';
  } else if (n === 3) {
    s += '<text x="132" y="104" font-size="13" fill="#15181C">A</text>';
    s += '<text x="276" y="104" font-size="13" fill="#15181C">B</text>';
    s += '<text x="204" y="222" text-anchor="middle" font-size="13" fill="#15181C">C</text>';
    s += '<text x="210" y="148" text-anchor="middle" font-size="10" fill="#15181C">A∩B∩C</text>';
  } else {
    s += '<text x="210" y="148" text-anchor="middle" font-size="12" fill="#15181C">' +
      esc(L("? · " + regs + " régió", "? · " + regs + " regions")) + "</text>";
    layout[n].forEach((c, i) => {
      s += '<text x="' + c.cx + '" y="' + (c.cy - (c.r || c.ry) + 4) +
        '" text-anchor="middle" font-size="10" fill="#6E7480">' + labs[i] + "</text>";
    });
  }
  el("vennbox").innerHTML = svg(W, H, s);

  el("regiontable").innerHTML = "<thead><tr><th>" + L("halmaz", "sets") +
    "</th><th class=\"num\">" + L("metszet", "intersections") +
    "</th><th>" + L("Venn?", "Venn?") + "</th></tr></thead><tbody>" +
    DATA.regions.map(r => {
      const ok = r.sets <= 3;
      return "<tr><td>" + r.sets + "</td><td class=\"num\">" + r.intersections +
        "</td><td>" + (ok ? L("még igen", "still yes") : L("már nem", "no longer")) + "</td></tr>";
    }).join("") + "</tbody>";
}

/* ---------- anatomy / examples / channels ---------- */
function renderAnatomy(rebuild) {
  const spec = DATA.anatomy;
  const classic = el("classicchart");
  if (rebuild !== false || !classic.innerHTML) {
    classic.innerHTML = drawUpset(spec, null, {
      sort: "size", colW: 44, nameW: 36, barW: 70, topH: 120, classic: true
    }).html;
  }
  const box = el("anatochart");
  if (rebuild !== false || !box._inters) {
    const drawn = drawUpset(spec, null, { sort: "size", colW: 44, nameW: 36, barW: 70, topH: 120 });
    box.innerHTML = drawn.html;
    box._inters = drawn.inters;
    bindUpset("anatochart", h => { state.hoverA = h; highlightAnatomy(); });
  }
  highlightAnatomy();
}
function highlightAnatomy() {
  const spec = DATA.anatomy, box = el("anatochart");
  applyHighlight(box, spec, box._inters, state.hoverA, null);
  paintExplain("anatoexplain", "anatoread", explain(spec, state.hoverA, box._inters, {}));
}

const EX_META = {
  features: {
    hu: "Termékmodulok", en: "Product modules",
    cap_hu: "Öt funkció, 14 oszlop. A keresés szinte mindenkit elér; az export ritka, és ritkán jár egyedül.",
    cap_en: "Five features, 14 columns. Search reaches almost everyone; export is rare, and rarely walks alone."
  },
  survey: {
    hu: "Kérdőív-témák", en: "Survey topics",
    cap_hu: "Hat téma egy elégedettségi kérdésben. A minőség és a kiszolgálás gyakran együtt jön — ez a sorok közti kapcsolat, nem a köröké.",
    cap_en: "Six topics on a satisfaction question. Quality and service often arrive together — a link between rows, not between circles."
  }
};

function renderExamples(rebuild) {
  el("exchips").innerHTML = Object.keys(EX_META).map(k =>
    '<button type="button" class="chip" data-ex="' + k + '" aria-pressed="' + (state.example === k) + '">' +
    esc(L(EX_META[k].hu, EX_META[k].en)) + "</button>"
  ).join("");
  el("exsort").innerHTML = [
    ["size", L("rendezés: méret", "sort: size")],
    ["degree", L("rendezés: fokszám", "sort: degree")]
  ].map(x => '<button type="button" class="chip" data-exsort="' + x[0] + '" aria-pressed="' +
    (state.exSort === x[0]) + '">' + esc(x[1]) + "</button>").join("");
  const spec = DATA[state.example];
  const meta = EX_META[state.example];
  el("extitle").textContent = L(spec.title_hu, spec.title_en);
  el("excap").textContent = L(meta.cap_hu, meta.cap_en) + " · " +
    L("látható ", "showing ") + spec.n_combos_shown + " / " + spec.n_combos_total +
    L(" metszet", " intersections");
  const box = el("exchart");
  if (rebuild !== false || !box._inters) {
    const drawn = drawUpset(spec, null, { sort: state.exSort, colW: 36, nameW: 100, barW: 80 });
    box.innerHTML = drawn.html;
    box._inters = drawn.inters;
    bindUpset("exchart", h => { state.hoverE = h; highlightExamples(); });
  }
  highlightExamples();
}
function highlightExamples() {
  const spec = DATA[state.example], box = el("exchart");
  applyHighlight(box, spec, box._inters, state.hoverE, null);
  paintExplain("exexplain", "exread", explain(spec, state.hoverE, box._inters, {}));
}

function renderChannels(rebuild) {
  const spec = DATA.channels;
  el("kpi-sets").textContent = fmtInt(spec.sets.length);
  el("kpi-combos").textContent = fmtInt(spec.n_combos_total);
  el("kpi-shown").textContent = fmtInt(spec.n_combos_shown);
  el("chsort").innerHTML = [
    ["size", L("rendezés: méret", "sort: size")],
    ["degree", L("rendezés: fokszám", "sort: degree")]
  ].map(x => '<button type="button" class="chip" data-chsort="' + x[0] + '" aria-pressed="' +
    (state.chSort === x[0]) + '">' + esc(x[1]) + "</button>").join("") +
    (state.focusSet !== null
      ? '<button type="button" class="chip" data-chsort="clear">' + esc(L("szűrő törlése", "clear filter")) + "</button>"
      : "");
  const box = el("chchart");
  if (rebuild !== false || !box._inters) {
    const drawn = drawUpset(spec, null, {
      sort: state.chSort, colW: 38, nameW: 84, barW: 86, focusSet: state.focusSet
    });
    box.innerHTML = drawn.html;
    box._inters = drawn.inters;
    bindUpset("chchart", h => { state.hoverC = h; highlightChannels(); }, si => {
      state.focusSet = state.focusSet === si ? null : si;
      state.hoverC = null;
      renderChannels(true);
    });
  }
  highlightChannels();
}
function highlightChannels() {
  const spec = DATA.channels, box = el("chchart");
  applyHighlight(box, spec, box._inters, state.hoverC, null);
  paintExplain("chexplain", "chread", explain(spec, state.hoverC, box._inters, { focusSet: state.focusSet }));
}

function renderAll() {
  applyLang();
  renderVenn();
  renderAnatomy();
  renderExamples();
  renderChannels();
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.id === "lang-hu") { state.lang = "hu"; renderAll(); return; }
  if (t.id === "lang-en") { state.lang = "en"; renderAll(); return; }
  if (t.dataset.venn) { state.venn = +t.dataset.venn; renderVenn(); return; }
  if (t.dataset.ex) { state.example = t.dataset.ex; state.hoverE = null; renderExamples(true); return; }
  if (t.dataset.exsort) { state.exSort = t.dataset.exsort; renderExamples(true); return; }
  if (t.dataset.chsort === "clear") { state.focusSet = null; renderChannels(true); return; }
  if (t.dataset.chsort) { state.chSort = t.dataset.chsort; renderChannels(true); }
});

renderAll();
</script>
</body>
</html>
