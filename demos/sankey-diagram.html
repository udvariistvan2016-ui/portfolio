<main>

<header class="hero">
  <p class="eyebrow" data-hu="Vizualizáció · anonimizált · kitalált adat" data-en="Visualisation · anonymised · synthetic data"></p>
  <h1 data-hu="Sankey-diagram: hol megy tovább a mennyiség" data-en="Sankey diagram: where the quantity goes next"></h1>
  <p class="lead" data-hu="A Sankey-diagram azt mutatja, <strong>honnan hova megy, hogyan áramlik</strong> egy mennyiség. A szalag vastagsága maga a mennyiség: ami vastag, az a domináns út, ami vékony, az a ritka átjárás. Akkor kell, ha a kérdés nem a „mennyi”, hanem a „hova lett belőle”." data-en="A Sankey diagram shows <strong>where a quantity goes, how it flows</strong>. Ribbon width is the quantity: thick is the dominant path, thin is the rare crossing. Use it when the question is not “how much”, but “where did it go”."></p>

  <div class="banner">
    <h4 data-hu="Ezen az oldalon minden szám kitalált" data-en="Every number on this page is synthetic"></h4>
    <p data-hu="Az ügyféláramlás ugyanabból a szintetikus kohorszból jön, mint a K-means esettanulmány: a metrikák számítottak, üzleti tartalom nem következtethető ki belőlük. A többi példa — energia, bevétel, webes forgalom — illusztráció, nem mért adat." data-en="The customer flow comes from the same synthetic cohort as the K-means case study: the figures are computed, but no business content can be inferred. The other examples — energy, revenue, web traffic — are illustrations, not measured data."></p>
  </div>

  <div class="kpis">
    <div class="kpi"><b>2</b><span data-hu="oszlop: forrás és cél" data-en="columns: source and target"></span></div>
    <div class="kpi"><b data-hu="vastagság" data-en="width"></b><span data-hu="a szalag szélessége a mennyiség" data-en="ribbon width is the quantity"></span></div>
    <div class="kpi"><b id="kpi-stay">92%</b><span data-hu="helyben marad a következő hónapban" data-en="stay in the same group next month"></span></div>
    <div class="kpi"><b>+ / −</b><span data-hu="a be- és kilépők is látszanak" data-en="entrants and leavers stay visible"></span></div>
  </div>
</header>

<section id="miez">
  <p class="eyebrow" data-hu="01 · Mi ez" data-en="01 · What it is"></p>
  <h2 data-hu="Egy megmaradó mennyiség két bontásban" data-en="One conserved quantity, two breakdowns"></h2>
  <p class="sub" data-hu="A név Matthew Henry Phineas Riall Sankey ír kapitánytól jön, aki 1898-ban egy gőzgép hatásfokát rajzolta így: a bejövő energia vastag szalagja elágazott hasznos munkára és veszteségre. A forma régebbi — Charles Minard 1869-es Napóleon-térképe ugyanezt a vastagság = mennyiség elvet használta —, a Sankey mára a „honnan–hova” ábra közneve lett." data-en="The name comes from Captain Matthew Henry Phineas Riall Sankey, who in 1898 drew a steam engine’s efficiency this way: the thick incoming-energy ribbon split into useful work and losses. The form is older — Charles Minard’s 1869 map of Napoleon’s march used the same width-equals-quantity rule — and Sankey is now the common name for a from–to chart."></p>

  <div class="grid2">
    <div class="card">
      <h3 data-hu="Amit megmutat" data-en="What it shows"></h3>
      <p class="small" data-hu="Ugyanaz a mennyiség két kategóriarendszer között. Bal oldalon egy bontás (honnan), jobb oldalon egy másik (hova). A szalagok a kettő közti leképezést viszik: nem csak az összegeket, hanem a kereszteződéseket is." data-en="The same quantity between two category systems. On the left, one breakdown (from); on the right, another (to). The ribbons carry the mapping between them: not only the totals, but the crossings."></p>
    </div>
    <div class="card">
      <h3 data-hu="Amit megőriz" data-en="What it conserves"></h3>
      <p class="small" data-hu="Ami balról kilép, jobbra megérkezik — plusz a rendszerbe belépő és onnan kilépő mennyiség, ha van ilyen. Ha a két oldal nem egyezik, az ábra hazudik, vagy hiányzik egy csomópont. Ezért jó ellenőrző ábra is: a számok összege látszik." data-en="What leaves on the left arrives on the right — plus anything entering or leaving the system, if that exists. If the two sides do not match, the chart is lying or a node is missing. That also makes it a check: the totals are visible."></p>
    </div>
  </div>
</section>

<section id="anatomia">
  <p class="eyebrow" data-hu="02 · Anatómia" data-en="02 · Anatomy"></p>
  <h2 data-hu="Négy elem, ennyi az egész" data-en="Four parts, that is the whole thing"></h2>
  <p class="sub" data-hu="Válassz egy részt. Az ábra azt emeli ki, a többi elhalványul. A példa szándékosan kicsi: 100 egység megy át A-ból és B-ből X-be és Y-ba, semmi nem vész el." data-en="Pick a part. The chart highlights it and fades the rest. The example is deliberately small: 100 units pass from A and B into X and Y, and nothing is lost."></p>

  <div class="chips" id="anatomychips" style="margin:0 0 14px"></div>
  <div class="grid2">
    <div class="chart">
      <h4 data-hu="100 egység, két forrás, két cél" data-en="100 units, two sources, two targets"></h4>
      <div id="anatomychart" class="sankeybox"></div>
      <p class="cap" id="anatomycap"></p>
    </div>
    <div class="stack" id="anatomytext"></div>
  </div>
</section>

<section id="mikor">
  <p class="eyebrow" data-hu="03 · Mikor" data-en="03 · When"></p>
  <h2 data-hu="Akkor, ha a kereszteződés a kérdés" data-en="When the crossing is the question"></h2>
  <p class="sub" data-hu="Egy egymásra pakolt oszlop megmutatja, mennyi van A-ból és B-ből, és mennyi lesz X-ből és Y-ból. Azt nem, hogy A-ból mennyi ment X-be. A Sankey pont ezt a hiányzó leképezést rajzolja meg." data-en="A stacked bar shows how much is in A and B, and how much ends up in X and Y. It does not show how much of A went to X. The Sankey is the chart that draws that missing mapping."></p>

  <div class="grid2">
    <div class="chart">
      <h4 data-hu="Amit egy oszlop elveszít" data-en="What a bar chart loses"></h4>
      <div id="barcompare"></div>
      <p class="cap" data-hu="Ugyanaz a 100 egység. Balra a forrás, jobbra a cél — de a kereszteződés eltűnt. A-ból 40 ment X-be és 20 Y-ba; ezt innen nem lehet kiolvasni." data-en="The same 100 units. Source on the left, target on the right — but the crossing has vanished. 40 of A went to X and 20 to Y; you cannot read that here."></p>
    </div>
    <div class="chart">
      <h4 data-hu="Amit a Sankey megtart" data-en="What the Sankey keeps"></h4>
      <div id="sankeycompare" class="sankeybox"></div>
      <p class="cap" data-hu="Ugyanazok a számok, a leképezéssel együtt. A vastag kék szalag: A → X, 40 egység. Ez a mondat az oszlopból nem jön ki." data-en="The same numbers, with the mapping. The thick blue ribbon: A → X, 40 units. That sentence does not come out of the bars."></p>
    </div>
  </div>

  <div class="grid2fixed" style="margin-top:18px">
    <div class="card yesno yes">
      <p class="tag" data-hu="Használd, ha" data-en="Use it when"></p>
      <h3 data-hu="Ugyanaz a mennyiség két bontásban" data-en="The same quantity in two breakdowns"></h3>
      <p data-hu="Energia forrásból felhasználásba, bevétel csatornából költségnembe, látogatás forrásból kimenetbe, ügyfél egyik állapotból a másikba. A kérdés: honnan jött, ami ott van." data-en="Energy from source to use, revenue from channel to cost type, visits from source to outcome, a customer from one state to another. The question: where did what is there come from."></p>
    </div>
    <div class="card yesno yes">
      <p class="tag" data-hu="Használd, ha" data-en="Use it when"></p>
      <h3 data-hu="A rendszerbe be- és kilépés is a történet" data-en="Entry and exit are part of the story"></h3>
      <p data-hu="Egy sima átmenetmátrix csak a közösen meglévő elemeket látja. Aki megjelent vagy eltűnt, az kimarad. Pszeudo-csomóponttal a Sankey ezt is viszi." data-en="A plain transition matrix only sees the elements present on both sides. Anyone who appeared or vanished is missing. With pseudo-nodes, the Sankey carries that too."></p>
    </div>
    <div class="card yesno no">
      <p class="tag" data-hu="Ne használd, ha" data-en="Do not use it when"></p>
      <h3 data-hu="Túl sok a kategória" data-en="There are too many categories"></h3>
      <p data-hu="Nyolc–tíz fölött a szalagok összekuszálódnak, és az ábra hajgombóccá válik. Ilyenkor a legnagyobb áramlások táblája többet mond, vagy a kategóriákat előbb össze kell vonni." data-en="Above eight or ten categories the ribbons tangle and the chart becomes a hairball. A table of the largest flows then says more, or the categories need merging first."></p>
    </div>
    <div class="card yesno no">
      <p class="tag" data-hu="Ne használd, ha" data-en="Do not use it when"></p>
      <h3 data-hu="A kérdés rangsor, idősor vagy arány egy pillanatban" data-en="The question is a ranking, a time series, or a snapshot share"></h3>
      <p data-hu="Egy mutató időben: vonal. Sorrend: oszlop. Egy torta összetétele egy időpontban: oszlop vagy treemap. A Sankey ezekre nem jobb, csak zsúfoltabb." data-en="One metric over time: a line. A ranking: a bar. The composition of a whole at one moment: a bar or a treemap. A Sankey is not better at these, only noisier."></p>
    </div>
  </div>
</section>

<section id="peldak">
  <p class="eyebrow" data-hu="04 · Más területek" data-en="04 · Other domains"></p>
  <h2 data-hu="Ugyanaz a forma, három teljesen más mennyiség" data-en="The same form, three entirely different quantities"></h2>

function L(hu, en) { return state.lang === "hu" ? hu : en; }

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmt(v, d) {
  if (v === null || v === undefined || Number.isNaN(v)) return "–";
  d = d === undefined ? 0 : d;
  return Number(v).toLocaleString(state.lang === "hu" ? "hu-HU" : "en-US", {
    minimumFractionDigits: d, maximumFractionDigits: d
  });
}
function fmtInt(v) { return fmt(v, 0); }
function pct(v, d) { return fmt(v * 100, d === undefined ? 1 : d) + "%"; }

  return '<svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="xMidYMid meet" role="img"' +

}

function tokens() {
  const C = DATA.customer;
  const stay = C.flows.reduce((a, row, i) => a + row[i], 0);
  return { "{STAY}": pct(stay / C.common_n, 0), "{ARI}": fmt(C.stability_ari, 3) };

function applyLang() {
  const tk = tokens();
  document.querySelectorAll("[data-hu]").forEach(node => {
    let txt = state.lang === "hu" ? node.getAttribute("data-hu") : node.getAttribute("data-en");
    if (txt === null) return;
    Object.keys(tk).forEach(k => { txt = txt.split(k).join(tk[k]); });

  el("lang-hu").setAttribute("aria-pressed", state.lang === "hu");

}

/* ---------- generic Sankey ---------- */
function totalsFromLinks(left, right, links) {
  const Ltot = {}, Rtot = {};
  left.forEach(n => { Ltot[n.id] = 0; });
  right.forEach(n => { Rtot[n.id] = 0; });
  links.forEach(lk => { Ltot[lk.from] += lk.n; Rtot[lk.to] += lk.n; });
  left.forEach(n => { n.n = Ltot[n.id]; });
  right.forEach(n => { n.n = Rtot[n.id]; });
}

function drawSankey(spec, opts) {
  opts = opts || {};
  const left = spec.left.map(n => Object.assign({}, n));
  const right = spec.right.map(n => Object.assign({}, n));
  const links = spec.links.map(lk => Object.assign({}, lk)).filter(lk => lk.n > 0);

  const mode = opts.mode || "all";
  const focus = opts.focus;
  const hover = opts.hover;
  const active = opts.activeCell;

  function visible(lk) {
    if (mode === "stay" && lk.kind !== "stay") return false;
    if (mode === "move" && lk.kind !== "move") return false;
    if (mode === "in" && lk.kind !== "in") return false;
    if (mode === "out" && lk.kind !== "out") return false;
    return true;
  }
  const shown = links.filter(visible);
  totalsFromLinks(left, right, shown);
  const leftN = left.filter(n => n.n > 0);
  const rightN = right.filter(n => n.n > 0);

  const W = spec.width || 900, H = spec.height || 430;
  const mt = 52, mb = 18, lw = spec.lw || 168, bw = 11, pad = 12;
  const xL = lw, xR = W - lw - bw;
  const leftTot = leftN.reduce((a, n) => a + n.n, 0);
  const rightTot = rightN.reduce((a, n) => a + n.n, 0);
  const nPad = Math.max(leftN.length, rightN.length, 1) - 1;
  const availH = H - mt - mb - pad * nPad;
  const sc = leftTot > 0 ? availH / leftTot : 1;

  function place(arr) {
    let y = mt;
    arr.forEach(nd => {
      nd.y = y;
      nd.h = Math.max(2.5, nd.n * sc);
      nd.cur = y;
      y += nd.h + pad;
    });

  place(leftN); place(rightN);

  leftN.forEach((n, i) => { lIndex[n.id] = i; });
  const rIndex = {};
  rightN.forEach((n, i) => { rIndex[n.id] = i; });

  shown.sort((a, b) => (lIndex[a.from] - lIndex[b.from]) || (rIndex[a.to] - rIndex[b.to]));
  shown.forEach(lk => {
    const sn = leftN[lIndex[lk.from]];
    lk.y1 = sn.cur;
    sn.cur += lk.n * sc;
  });
  rightN.forEach(nd => {
    shown.filter(l => l.to === nd.id).forEach(lk => {
      lk.y2 = nd.cur;
      nd.cur += lk.n * sc;
    });
  });

      if (focus.side === "r" && lk.to !== focus.id) return false;
    }
    if (hover && (lk.from !== hover.from || lk.to !== hover.to)) return false;
    if (active && (lk.from !== active.from || lk.to !== active.to)) return false;
    return true;
  }
  const anyFilter = !!(focus || hover || active);

  let s = "";
  s += '<text x="' + (xL + bw) + '" y="22" text-anchor="end" font-size="11" fill="#15181C" font-weight="500">' +
    esc(spec.leftTitle) + "</text>";
  if (spec.leftSub) {
    s += '<text x="' + (xL + bw) + '" y="37" text-anchor="end" font-size="10" fill="#9AA1AB">' +
      esc(spec.leftSub) + "</text>";
  }
  s += '<text x="' + xR + '" y="22" font-size="11" fill="#15181C" font-weight="500">' +
    esc(spec.rightTitle) + "</text>";
  if (spec.rightSub) {
    s += '<text x="' + xR + '" y="37" font-size="10" fill="#9AA1AB">' + esc(spec.rightSub) + "</text>";
  }

  const LABEL_MIN = spec.labelMin || 0;
  const placed = [];
  let labelSvg = "";
  const drawLinks = shown.slice().sort((a, b) => b.n - a.n);
  drawLinks.forEach(lk => {

    const x1 = xL + bw, x2 = xR, xm = (x1 + x2) / 2;

      '" d="M' + x1 + "," + a1.toFixed(1) + " C" + xm + "," + a1.toFixed(1) + " " + xm + "," +
      a2.toFixed(1) + " " + x2 + "," + a2.toFixed(1) + " L" + x2 + "," + b2.toFixed(1) + " C" +
      xm + "," + b2.toFixed(1) + " " + xm + "," + b1.toFixed(1) + " " + x1 + "," + b1.toFixed(1) +
      ' Z" fill="' + col + '" opacity="' + op + '"></path>';
    if (on && lk.n >= LABEL_MIN && !anyFilter) {
      const my = (a1 + b1 + a2 + b2) / 4;
      const cands = [xm, xm - 96, xm + 96];
      let lx = null;
      for (let ci = 0; ci < cands.length && lx === null; ci++) {
        const cx = cands[ci];
        if (!placed.some(p => Math.abs(p.x - cx) < 50 && Math.abs(p.y - my) < 15)) lx = cx;
      }
      if (lx !== null) {
        placed.push({ x: lx, y: my });
        labelSvg += '<rect x="' + (lx - 22) + '" y="' + (my - 8) + '" width="44" height="15" rx="2" fill="#FFFFFF" opacity=".85"/>' +
          '<text x="' + lx + '" y="' + (my + 3) + '" text-anchor="middle" font-size="10" fill="#15181C">' +
          fmtInt(lk.n) + "</text>";
      }
    }
  });
  s += labelSvg;

  function drawNodes(arr, x, side) {
    arr.forEach(nd => {
      const focused = focus && focus.side === side && focus.id === nd.id;
      const faded = focus && !(focus.side === side && focus.id === nd.id);
      s += '<rect class="nodehit" data-side="' + side + '" data-id="' + esc(nd.id) +
        '" x="' + x + '" y="' + nd.y + '" width="' + bw + '" height="' + nd.h + '" rx="2" fill="' +
        nd.color + '" opacity="' + (faded ? 0.22 : (nd.pseudo ? 0.85 : 1)) + '"></rect>';
      const tx = side === "l" ? x - 9 : x + bw + 9;
      const anc = side === "l" ? "end" : "start";
      const yc = nd.y + nd.h / 2;
      const fill = faded ? "#B0B6BE" : "#15181C";
      const name = nm(nd);
      s += '<text class="nodehit" data-side="' + side + '" data-id="' + esc(nd.id) +
        '" x="' + tx + '" y="' + (yc - 1) + '" text-anchor="' + anc + '" font-size="10.5" fill="' + fill +
        '" font-weight="' + (focused ? "600" : "400") + '">' + esc(name) + "</text>";
      const shareBase = side === "l" ? leftTot : rightTot;
      const share = (nd.pseudo || spec.hideShare) ? "" : " · " + pct(nd.n / shareBase, 1);
      s += '<text class="nodehit" data-side="' + side + '" data-id="' + esc(nd.id) +
        '" x="' + tx + '" y="' + (yc + 11) + '" text-anchor="' + anc + '" font-size="9.5" fill="#9AA1AB">' +
        fmtInt(nd.n) + share + "</text>";
    });
  }
  drawNodes(leftN, xL, "l");
  drawNodes(rightN, xR, "r");

  if (spec.foot) {
    s += '<text x="0" y="' + (H - 2) + '" font-size="9.5" fill="#9AA1AB">' + esc(spec.foot) + "</text>";
  }

  return { html: svg(W, H, s, ' style="max-height:none"'), left: leftN, right: rightN, links: shown };
}

function emptyReadout(msg) {
  return '<div class="cell" style="grid-column:1/-1"><div class="k">' +
    esc(L("szalag", "ribbon")) + '</div><div class="v" style="font-weight:500;color:#6E7480">' +
    esc(msg) + "</div></div>";
}
function readoutCells(items) {
  return items.map(it => '<div class="cell"><div class="k">' + esc(it.k) +
    '</div><div class="v">' + it.v + "</div></div>").join("");
}

function describeLink(spec, lk) {
  const src = spec.left.find(n => n.id === lk.from);
  const tgt = spec.right.find(n => n.id === lk.to);
  let srcTot = 0, tgtTot = 0;
  spec.links.forEach(x => { if (x.from === lk.from) srcTot += x.n; if (x.to === lk.to) tgtTot += x.n; });
  return readoutCells([
    { k: L("honnan", "from"), v: esc(nm(src)) },
    { k: L("hova", "to"), v: esc(nm(tgt)) },
    { k: spec.unit, v: fmtInt(lk.n) },
    { k: L("a forrásból", "of source"), v: pct(lk.n / srcTot, 1) },
    { k: L("a célban", "of target"), v: pct(lk.n / tgtTot, 1) }
  ]);
}

function bindSankey(box, spec, hoverId, onHover, onNode) {
  const root = el(box);
  root.onpointerover = ev => {
    const p = ev.target.closest("[data-from]");
    if (!p) return;
    onHover({ from: p.getAttribute("data-from"), to: p.getAttribute("data-to") });
  };
  root.onpointerleave = () => onHover(null);
  root.onclick = ev => {
    const n = ev.target.closest("[data-side]");
    if (n && onNode) {
      onNode({ side: n.getAttribute("data-side"), id: n.getAttribute("data-id") });
      return;
    }
    const p = ev.target.closest("[data-from]");
    if (p) onHover({ from: p.getAttribute("data-from"), to: p.getAttribute("data-to") });
  };
}

/* ---------- heatmap ---------- */
function renderHeat() {
  const C = DATA.customer, M = DATA.meta;
  const labs = state.lang === "hu" ? M.labels_hu : M.labels_en;
  const ids = ["c0", "c1", "c2", "c3"];
  const mx = Math.max(
    ...C.flows.flat(),
    ...C.entrants,
    ...C.leavers
  );
  function bg(n, color, dead) {
    if (dead) return "#F2F3F0";
    const t = Math.sqrt(n / mx);
    const hex = color.replace("#", "");
    const r = parseInt(hex.slice(0, 2), 16), g = parseInt(hex.slice(2, 4), 16), b = parseInt(hex.slice(4, 6), 16);
    return "rgba(" + r + "," + g + "," + b + "," + (0.12 + t * 0.72).toFixed(2) + ")";
  }
  function cell(from, to, n, color, dead) {
    const on = state.cell && state.cell.from === from && state.cell.to === to;
    const cls = dead ? "dead" : "cellbtn";
    const style = "background:" + bg(n, color, dead) + (on ? ";outline:2px solid #15181C;outline-offset:-2px" : "");
    if (dead) return '<td class="dead"></td>';
    return '<td class="' + cls + '" data-from="' + from + '" data-to="' + to + '" style="' + style + '">' +
      fmtInt(n) + "</td>";
  }
  let h = "<thead><tr><th></th>";
  labs.forEach(lb => { h += "<th>" + esc(lb) + "</th>"; });
  h += "<th>" + esc(L("Kieső", "Leaving")) + "</th></tr></thead><tbody>";
  labs.forEach((lb, i) => {
    h += '<tr><td class="lab"><span class="swatch" style="background:' + CC[i] + '"></span>' + esc(lb) + "</td>";
    for (let j = 0; j < 4; j++) h += cell("c" + i, "c" + j, C.flows[i][j], CC[i], false);
    h += cell("c" + i, "out", C.leavers[i], OUT_C, false);
    h += "</tr>";
  });
  h += '<tr><td class="lab"><span class="swatch" style="background:' + IN_C + '"></span>' +
    esc(L("Belépő", "Entering")) + "</td>";
  for (let j = 0; j < 4; j++) h += cell("in", "c" + j, C.entrants[j], IN_C, false);
  h += cell("in", "out", 0, "#ccc", true);
  h += "</tr></tbody>";
  el("heattable").innerHTML = h;
}

  const t = ev.target.closest("button");
  if (!t) {
    const cell = ev.target.closest("#heattable td.cellbtn");
    if (cell) {
      const next = { from: cell.getAttribute("data-from"), to: cell.getAttribute("data-to") };
      if (state.cell && state.cell.from === next.from && state.cell.to === next.to) state.cell = null;
      else state.cell = next;
      state.hover = null;
      renderCustomer();
      renderHeat();
    }
    return;
  }
  if (t.id === "lang-hu") { state.lang = "hu"; renderAll(); return; }
  if (t.id === "lang-en") { state.lang = "en"; renderAll(); return; }
  if (t.dataset.anatomy) { state.anatomy = t.dataset.anatomy; renderAnatomy(); return; }
  if (t.dataset.ex) { state.example = t.dataset.ex; state.hover = null; renderExamples(); return; }
  if (t.dataset.mode === "clearfocus") { state.focus = null; renderCustomer(); return; }
  if (t.dataset.mode) { state.mode = t.dataset.mode; renderCustomer(); renderHeat(); }
});

renderAll();
</script>
</body>
</html>
