<!DOCTYPE html>
<html lang="hu" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POI-CRM → HubSpot dataflow — demo</title>
<style>
  /* Azonos design-nyelv a portfólió demóval (viz/poicrm_portfolio_demo.html) — light+dark */
  :root{
    --bg:#f4f6fa; --bg2:#eef2f8;
    --text-strong:#16233b; --text-mid:#5d6b82; --text-dim:#7a8699;
    --panel:#ffffff; --panel-border:#dde3ed; --panel-soft:#f7f9fc;
    --btn-bg:#ffffff; --btn-border:#c9d2e0; --btn-text:#3d4a61; --btn-hover:#eef2f8;
    --accent:#2f6fdb; --accent-soft:#e7eefb;
    --badge-bg:#e3e9f2; --badge-text:#4a5a75;
    --badge-run-bg:#fdf0d5; --badge-run-text:#9a6700;
    --badge-done-bg:#d9f2e0; --badge-done-text:#116632;
    --badge-err-bg:#fde0e4; --badge-err-text:#a3132f;
    --row-hover:#f0f5fc; --th-bg:#eef2f8;
    --st-pending:#c2cbd9; --st-running:#e8a200; --st-done:#1a9e50; --st-error:#d94560;
    --cat-input:#2f6fdb; --cat-transform:#1a9e78; --cat-check:#8a4bdb; --cat-output:#d97c10; --cat-merge:#d94560;
    --warn:#d97c10; --good:#1a9e50; --shadow:0 8px 28px rgba(22,35,59,.10);
    --canvas-bg:#f7f9fc; --grid:rgba(47,111,219,.06); --pipe:#c2cbd9;
  }
  :root[data-theme="dark"]{
    --bg:#070d18; --bg2:#0b1424;
    --text-strong:#e9f0ff; --text-mid:#93a5c4; --text-dim:#6b7f9f;
    --panel:#0e1830; --panel-border:#1c2a44; --panel-soft:#0b1526;
    --btn-bg:#0e1830; --btn-border:#2a3d61; --btn-text:#b9c7e0; --btn-hover:#16244077;
    --accent:#41a6ff; --accent-soft:#122a49;
    --badge-bg:#14213a; --badge-text:#8fa3c6;
    --badge-run-bg:#2a2008; --badge-run-text:#ffcf6b;
    --badge-done-bg:#062b1a; --badge-done-text:#3fe8ab;
    --badge-err-bg:#2a0d15; --badge-err-text:#ff90a5;
    --row-hover:#12203a; --th-bg:#0b1526;
    --st-pending:#3c4d6c; --st-running:#ffbb33; --st-done:#27e07f; --st-error:#ff5f7e;
    --cat-input:#41a6ff; --cat-transform:#22dfa0; --cat-check:#bf7bff; --cat-output:#ffb03a; --cat-merge:#ff5f7e;
    --warn:#ffb03a; --good:#27e07f; --shadow:0 10px 32px rgba(0,0,0,.55);
    --canvas-bg:#0a1424; --grid:rgba(65,166,255,.06); --pipe:#243a5e;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background-color:var(--bg);color:var(--text-strong);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
       font-size:14px;line-height:1.5;min-height:100vh;transition:background-color .2s,color .2s;}
  header{display:flex;align-items:flex-start;gap:16px;padding:18px 26px;border-bottom:1px solid var(--panel-border);position:sticky;top:0;background:var(--bg);z-index:30;}
  header .brand h1{font-size:19px;font-weight:650;letter-spacing:.3px;} header .brand h1 .arrow{color:var(--cat-transform);}
  header .brand p{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .demo-tag{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);vertical-align:middle;}
  .run-state{display:inline-block;margin-top:9px;font-size:12.5px;font-weight:600;padding:4px 13px;border-radius:14px;background:var(--badge-bg);color:var(--badge-text);}
  .run-state.running{background:var(--badge-run-bg);color:var(--badge-run-text);}
  .run-state.done{background:var(--badge-done-bg);color:var(--badge-done-text);}
  .run-state.error{background:var(--badge-err-bg);color:var(--badge-err-text);}
  .spacer{flex:1;} .controls{display:flex;gap:8px;align-items:center;}
  button{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--btn-text);background:var(--btn-bg);border:1px solid var(--btn-border);border-radius:16px;padding:7px 15px;cursor:pointer;transition:.15s;}
  button:hover:not(:disabled){background:var(--btn-hover);border-color:var(--accent);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  /* hover: marad a kék kitöltés + fehér betű, csak kicsit sötétebb árnyalat (olvasható marad) */
  button.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:#fff;filter:brightness(.9);box-shadow:0 2px 10px rgba(47,111,219,.35);}
  .wrap{padding:24px 26px;max-width:1440px;margin:0 auto;}
  .sources{display:flex;flex-wrap:wrap;gap:22px;background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow);align-items:flex-start;}
  .src{display:flex;flex-direction:column;gap:7px;min-width:230px;} .src .lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-dim);}
  .seg{display:flex;border:1px solid var(--btn-border);border-radius:10px;overflow:hidden;}
  .seg button{border:none;border-radius:0;padding:8px 15px;border-right:1px solid var(--btn-border);} .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--accent);color:#fff;} .seg button.soon{opacity:.5;}
  .src-run{margin-left:auto;display:flex;align-items:flex-end;}
  /* file-választó */
  .filerow{display:flex;gap:6px;align-items:center;}
  .filerow input[type=text]{font-family:inherit;font-size:12px;padding:7px 10px;border-radius:8px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--text-strong);width:250px;}
  .filerow select{font-family:inherit;font-size:12px;padding:7px 8px;border-radius:8px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--text-strong);max-width:260px;}
  .fileinfo{font-size:11px;color:var(--text-dim);min-height:15px;}
  .fileinfo.warn{color:var(--warn);}
  .chips{display:flex;flex-wrap:wrap;gap:11px;margin-bottom:10px;}
  .chip{background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:11px 15px;min-width:118px;box-shadow:var(--shadow);}
  .chip .k{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-dim);margin-bottom:4px;} .chip .v{font-size:22px;font-weight:680;}
  .chip.warn .v{color:var(--warn);} .chip.good .v{color:var(--good);}
  .meta{font-size:12px;color:var(--text-dim);margin-bottom:20px;} .meta b{color:var(--text-mid);font-weight:600;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--panel-border);margin-bottom:16px;}
  .tabs button{border:none;border-radius:0;background:transparent;color:var(--text-mid);padding:11px 18px;border-bottom:2px solid transparent;font-weight:600;}
  .tabs button.on{color:var(--text-strong);border-bottom-color:var(--cat-transform);}
  .view{display:none;} .view.on{display:block;animation:fade .25s;} @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;}}
  .layout-toggle{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .layout-toggle .seg{border-radius:10px;} .lt-hint{font-size:11px;color:var(--text-dim);}
  .canvas-box{position:relative;background:var(--canvas-bg);border:1px solid var(--panel-border);border-radius:12px;overflow:auto;box-shadow:var(--shadow);cursor:grab;}
  .canvas-box.grabbing{cursor:grabbing;}
  .canvas-box.full{height:64vh;} .canvas-box.strip{height:150px;margin-bottom:16px;cursor:default;}
  .canvas-box canvas{display:block;}
  .canvas-tools{display:flex;align-items:center;gap:14px;margin-bottom:10px;flex-wrap:wrap;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;}
  .legend .lg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-mid);}
  .legend .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .zoom{margin-left:auto;display:inline-flex;border:1px solid var(--btn-border);border-radius:10px;overflow:hidden;}
  .zoom button{border:none;border-radius:0;padding:5px 12px;font-size:13px;border-right:1px solid var(--btn-border);min-width:40px;}
  .zoom button:last-child{border-right:none;}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:300;display:flex;align-items:center;justify-content:center;}
  .modal{background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;width:min(560px,92vw);max-height:80vh;display:flex;flex-direction:column;box-shadow:var(--shadow);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--panel-border);font-size:14px;}
  .modal-head button{border:none;background:transparent;font-size:15px;padding:2px 8px;}
  .dp-path{padding:8px 18px;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--panel-border);word-break:break-all;}
  .dp-list{overflow:auto;flex:1;min-height:220px;}
  .dp-item{display:flex;align-items:center;gap:8px;padding:9px 18px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--panel-soft);}
  .dp-item:hover{background:var(--row-hover);}
  .modal-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--panel-border);}
  .dp-cur{flex:1;font-size:11px;color:var(--text-mid);word-break:break-all;}
  #tooltip{position:fixed;pointer-events:none;z-index:200;max-width:300px;background:var(--panel);border:1px solid var(--panel-border);
           border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;}
  #tooltip.show{opacity:1;} #tt-title{font-weight:650;font-size:13px;color:var(--text-strong);}
  #tt-type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin:2px 0 6px;}
  #tt-desc{font-size:12px;color:var(--text-mid);line-height:1.5;} #tt-meta{font-size:11px;color:var(--text-dim);margin-top:6px;}
  .flow{display:flex;flex-direction:column;gap:20px;}
  .lane{display:flex;gap:12px;flex-wrap:wrap;}
  .lane-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-dim);width:100%;border-bottom:1px dashed var(--panel-border);padding-bottom:4px;font-weight:700;}
  .node{background:var(--panel);border:1px solid var(--panel-border);border-radius:11px;padding:12px 15px;min-width:158px;box-shadow:var(--shadow);border-left:3px solid var(--nc,var(--accent));}
  .node.input{--nc:var(--cat-input);} .node.transform{--nc:var(--cat-transform);} .node.check{--nc:var(--cat-check);} .node.output{--nc:var(--cat-output);}
  .node .t{font-size:13px;font-weight:640;margin-bottom:2px;} .node .s{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--text-dim);}
  .node .badge{font-size:16px;font-weight:680;margin-top:7px;color:var(--nc);} .node .sub{font-size:10.5px;color:var(--text-dim);margin-top:3px;}
  .node.check.warn{border-color:var(--warn);} .node.check.warn .badge{color:var(--warn);} .node.check.clean .badge{color:var(--good);}
  .arrow-r{align-self:center;color:var(--text-dim);font-size:18px;}
  .hint{font-size:11px;color:var(--text-dim);margin-top:14px;}
  .browser{display:grid;grid-template-columns:240px 1fr;gap:18px;}
  .tablist{display:flex;flex-direction:column;gap:7px;}
  .tablist button{text-align:left;border-radius:9px;padding:11px 14px;display:flex;justify-content:space-between;gap:8px;}
  .tablist button.on{border-color:var(--cat-transform);background:var(--accent-soft);}
  .tablist .cnt{font-size:11px;color:var(--text-dim);font-weight:700;} .tablist button.warn .cnt{color:var(--warn);}
  .panel{background:var(--panel);border:1px solid var(--panel-border);border-radius:11px;overflow:hidden;box-shadow:var(--shadow);}
  .panel .head{padding:12px 16px;border-bottom:1px solid var(--panel-border);font-size:12px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center;} .panel .head b{color:var(--text-strong);font-size:13px;}
  .tscroll{overflow:auto;max-height:60vh;}
  table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap;}
  th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--panel-border);max-width:340px;overflow:hidden;text-overflow:ellipsis;}
  th{position:sticky;top:0;background:var(--th-bg);color:var(--text-mid);font-weight:650;text-transform:uppercase;font-size:10px;letter-spacing:.5px;z-index:1;}
  tbody tr:hover td{background:var(--row-hover);} td:first-child,th:first-child{color:var(--text-dim);}
  .downloads{margin-bottom:20px;} .downloads h3{font-size:13px;font-weight:650;margin-bottom:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .dl-opt{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--text-dim);}
  .dl-opt select{font-family:inherit;font-size:11px;padding:4px 6px;border-radius:7px;border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--text-strong);}
  .fmt{display:inline-flex;border:1px solid var(--btn-border);border-radius:10px;overflow:hidden;} .fmt button{border:none;border-radius:0;padding:5px 12px;font-size:11.5px;} .fmt button.on{background:var(--accent);color:#fff;}
  .dlgrid{display:flex;flex-wrap:wrap;gap:10px;}
  .dl{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--panel-border);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow);}
  .dl .lab{font-weight:600;font-size:12.5px;} .dl .rows{font-size:11px;color:var(--text-dim);} .dl a{text-decoration:none;}
  .dl.summary-dl{border-color:var(--accent);} .dl.summary-dl button{cursor:pointer;}
  .future{margin-top:14px;font-size:11.5px;color:var(--text-dim);} .future button{margin-left:8px;}
  .hitl{margin-bottom:20px;background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
  .hitl h3{font-size:13px;font-weight:650;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .hitl .tag{font-size:9.5px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);}
  .hitl label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-strong);cursor:pointer;margin-bottom:8px;}
  .hitl-note{font-size:11.5px;color:var(--text-dim);margin-bottom:12px;line-height:1.5;}
  .hitl-diff{background:var(--panel-soft);border:1px solid var(--panel-border);border-radius:9px;padding:11px 14px;margin-bottom:12px;}
  .hitl-cap{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);margin-bottom:7px;}
  .hitl-row{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;} .hitl-row b{color:var(--text-strong);}
  .hitl-row.warn b{color:var(--warn);}
  .hitl-soon{font-size:11px;color:var(--text-dim);font-style:italic;margin-top:7px;border-top:1px dashed var(--panel-border);padding-top:7px;}
  .hitl-actions{display:flex;gap:10px;}
  .banner{padding:14px 18px;border-radius:10px;border:1px solid var(--panel-border);margin-bottom:18px;font-size:13px;}
  .banner.error{border-color:var(--st-error);background:var(--badge-err-bg);color:var(--badge-err-text);}
  .banner.empty{border-color:var(--st-running);background:var(--badge-run-bg);color:var(--badge-run-text);}
  .hidden{display:none!important;}
  ::-webkit-scrollbar{height:10px;width:10px;} ::-webkit-scrollbar-track{background:var(--bg2);} ::-webkit-scrollbar-thumb{background:var(--panel-border);border-radius:5px;}
</style>
</head>
<body>
<div style="font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;padding:10px 20px;background:#15181C;color:#F2F3F0;position:sticky;top:0;z-index:99999;display:flex;justify-content:space-between;align-items:center;gap:12px;">
  <a href="../index.html" style="color:#8FD3BF;text-decoration:none;">&larr; Vissza a projektekhez</a>
  <span style="opacity:.65;">Udvari István &middot; Data Analyst</span>
</div>

<header>
  <div class="brand">
    <h1>POI-CRM <span class="arrow">→</span> HubSpot <span class="demo-tag">DEMO</span></h1>
    <p data-i18n="tagline"></p>
    <span class="run-state" id="runState">—</span>
  </div>
  <div class="spacer"></div>
  <div class="controls">
    <div class="seg" style="border-radius:16px;">
      <button id="langHu" class="on" onclick="setLang('hu')">HU</button>
      <button id="langEn" onclick="setLang('en')">EN</button>
    </div>
    <button id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<div class="wrap">
  <div id="banner" class="banner hidden"></div>

  <div class="sources">
    <div class="src">
      <span class="lbl" data-i18n="srcAdmin">Admin lista (POI CRM)</span>
      <div class="seg">
        <button data-i18n="srcLocal" onclick="pickSource('poi','file',this)">Lokál</button>
        <button class="on" onclick="pickSource('poi','sharepoint',this)">SharePoint</button>
      </div>
      <div class="fileinfo" id="infoPoi"></div>
    </div>
    <div class="src">
      <span class="lbl" data-i18n="srcHubspot">HubSpot lista</span>
      <div class="seg">
        <button data-i18n="srcLocal" onclick="pickSource('hubspot','file',this)">Lokál</button>
        <button class="on" onclick="pickSource('hubspot','sharepoint',this)">SharePoint</button>
        <button class="soon" disabled title="hamarosan">HubSpot API</button>
      </div>
      <div class="fileinfo" id="infoHubspot"></div>
    </div>
    <div class="src-run"><button class="primary" id="runBtn" onclick="onRunButton()">Futtatás</button></div>
  </div>

  <div class="chips" id="chips"></div>
  <div class="meta" id="meta"></div>

  <div class="tabs">
    <button class="on" onclick="setTab('flow')" id="tabFlow" data-i18n="tabFlow"></button>
    <button onclick="setTab('data')" id="tabData" data-i18n="tabData"></button>
    <button onclick="setTab('log')" id="tabLog" data-i18n="tabLog"></button>
  </div>

  <div class="view on" id="viewFlow">
    <div class="canvas-tools">
      <div class="legend" id="legend"></div>
      <div class="zoom">
        <button onclick="zoomBy(-0.15)" title="kicsinyítés">−</button>
        <button onclick="zoomReset()" title="alaphelyzet" id="zoomLabel">100%</button>
        <button onclick="zoomBy(0.15)" title="nagyítás">+</button>
      </div>
    </div>
    <div class="canvas-box full" id="boxFull"><canvas id="cvFull"></canvas></div>
    <div class="hint" data-i18n="flowHint" style="margin:12px 0 18px;"></div>
    <div class="flow" id="flow"></div>
  </div>

  <div class="view" id="viewData">
    <div class="downloads" id="downloads"></div>
    <div class="hitl" id="hitl"></div>
    <div class="browser">
      <div class="tablist" id="tablist"></div>
      <div class="panel"><div class="head"><b id="tableTitle">—</b><span id="tableInfo"></span></div>
        <div class="tscroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div>
    </div>
  </div>

  <div class="view" id="viewLog">
    <div class="panel"><div class="head"><b data-i18n="tabLog"></b><span id="logInfo"></span></div>
      <div class="tscroll"><table><thead id="logThead"></thead><tbody id="logTbody"></tbody></table></div></div>
  </div>
</div>

<div id="tooltip"><div id="tt-title"></div><div id="tt-type"></div><div id="tt-desc"></div><div id="tt-meta"></div></div>

function fit(ctx,txt,max){let s=txt;while(ctx.measureText(s).width>max&&s.length>4)s=s.slice(0,-2);return s===txt?txt:s+'…';}

function pipeEnds(p){const a=NODE[p[0]],b=NODE[p[1]];if(!a||!b)return null;const A=nodeXY(a),B=nodeXY(b);return {ax:A.x+NW,ay:A.y+NH/2,bx:B.x,by:B.y+NH/2};}

  const y=Math.pow(1-tt,3)*e.ay+3*Math.pow(1-tt,2)*tt*e.ay+3*(1-tt)*tt*tt*e.by+tt*tt*tt*e.by;
  const P=palette();ctx.beginPath();ctx.arc(x,y,3.4,0,7);ctx.fillStyle=P.done;ctx.shadowColor=P.done;ctx.shadowBlur=9;ctx.fill();ctx.shadowBlur=0;}

  PIPES.forEach(p=>drawPipe(ctx,p));packets.forEach(pk=>{if(flowing){pk.t+=pk.speed;if(pk.t>1)pk.t=0;}drawPacket(ctx,pk);});NODES.forEach(n=>drawNode(ctx,n,mini));}

    <div class="dlgrid">
      <div class="dl summary-dl" title="A KPI-kártyák értékei szövegként — e-mailbe/Teamsbe másolható."><span class="lab">📋 ${t('summaryCard')}</span><span class="rows">${t('summarySub')}</span><button onclick="downloadSummary()">TXT ↓</button></div>`+
    files.map((w,i)=>`<div class="dl"><span class="lab">${w.label}</span><span class="rows">${num(w.rows)} ${t('rows')}</span><button onclick="dlDemo(${i})">${t('download')} ↓</button></div>`).join('')+
    `</div><div class="future">${t('hubspotUpdate')}<button disabled>HubSpot update ↑</button></div>`;}
function setFmt(f){dlFormat=f;renderDownloads();}
// ═══ Összefoglaló (KPI-kártyák szövegként) — e-mailhez/Teamshez, kliensoldali .txt ═══
function summaryText(){
  const r=histRun||data.record||{};
  const L=[];
  L.push('POI-CRM → HubSpot dataflow — '+t('summaryTitle'));
  L.push((r.idopont||'')+'  ·  '+(r.verzio||'')+(histRun?('  ·  '+t('histNote')):''));
  L.push('');
  if(r.poi_filename||r.hubspot_filename){
    const fl=lang==='en'?{poi:'poi export file',hs:'HubSpot file'}:{poi:'poi export fájl',hs:'HubSpot fájl'};
    L.push(fl.poi+': '+(r.poi_filename||'—'));
    L.push(fl.hs+': '+(r.hubspot_filename||'—'));
    L.push('');
  }
  chipDefs().forEach(x=>{ if(x.v==null) return;
    L.push(x.k+': '+(x.suffix?num(x.v)+x.suffix:num(x.v))); });
  return L.join('\n');
}
function downloadSummary(){
  const r=histRun||data.record||{};
  const stamp=(r.idopont||'').replace(/[^0-9]/g,'').slice(0,12)||'demo';
  const blob=new Blob([summaryText()],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='poicrm_osszefoglalo_'+stamp+'.txt';
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);
}
// DEMO: kliensoldali letöltés a beágyazott tábla-előnézetből (BOM + elválasztó kliensoldalon;
// a cp1250/iso-8859-2 konverziót az éles app végzi szerveroldalon)
function dlDemo(i){const w=(data.written_files||[])[i];if(!w)return;const tb=(data.tables||{})[w.label];if(!tb)return;
  const dc={comma:',',semicolon:';',tab:'\t'}[dlDelim]||',';
  const esc=v=>{v=String(v??'');return (v.includes(dc)||v.includes('"')||v.includes('\n'))?'"'+v.replace(/"/g,'""')+'"':v;};
  const text=[tb.columns.map(esc).join(dc),...tb.rows.map(r=>r.map(esc).join(dc))].join('\r\n');
  const blob=new Blob(dlEnc==='utf-8-sig'?['﻿'+text]:[text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=w.path;a.click();URL.revokeObjectURL(a.href);}
function toggleHitl(){hitlOn=document.getElementById('hitlChk').checked;try{localStorage.setItem('poicrm-hitl',hitlOn?'1':'0');}catch(e){}}
function renderHitl(){const r=histRun||data.record||{};
  const dupW=(r.poi_duplikacio>0||r.hubspot_duplikacio>0), mmW=r.categories_mismatch>0;
  const checkTxt=`poi export dup ${num(r.poi_duplikacio)} · HubSpot dup ${num(r.hubspot_duplikacio)} · ${t('checks')} mismatch ${num(r.categories_mismatch)}`;
  const histBanner=histRun?`<div class="hitl-soon" style="color:var(--warn);font-style:normal;font-weight:600;border:none;margin:0 0 8px;padding:0;">${t('replayNote')}</div>`:'';
  document.getElementById('hitl').innerHTML=`
    <h3>${t('hitlTitle')} <span class="tag">${t('hitlL3')}</span></h3>
    ${histBanner}
    <label><input type="checkbox" id="hitlChk" ${hitlOn?'checked':''} onchange="toggleHitl()"> ${t('hitlApprove')}</label>
    <div class="hitl-note">${t('hitlNote')}</div>
    <div class="hitl-diff">
      <div class="hitl-cap">${t('hitlWrite')}</div>
      <div class="hitl-row"><span>Companies</span><b>${num(r.companies_sorok)} ${t('rows')}</b></div>
      <div class="hitl-row"><span>Contacts</span><b>${num(r.contacts_sorok)} ${t('rows')}</b></div>
      <div class="hitl-row ${dupW||mmW?'warn':''}"><span>${t('checks')}</span><b>${checkTxt}</b></div>
      <div class="hitl-soon">${t('hitlDiffSoon')}</div>
    </div>
    <div class="hitl-actions">
      <button disabled title="${t('hitlL3')}">${t('hitlApproveBtn')} ↑</button>
      <button disabled>${t('hitlReject')}</button>
    </div>`;}
function renderTableList(){const tables=data.tables||{},names=Object.keys(tables);if(!activeTable&&names.length)activeTable=names[0];
  document.getElementById('tablist').innerHTML=names.map(name=>{const tb=tables[name];const isCheck=name.includes('duplik')||name.includes('Kategória');const warn=isCheck&&tb.total>0&&!(tb.rows[0]&&/NINCS|^-$/.test(tb.rows[0][0]||''));
    return `<button class="${name===activeTable?'on':''} ${warn?'warn':''}" onclick="showTable('${name.replace(/'/g,"\\'")}')"><span>${name}</span><span class="cnt">${num(tb.total)}</span></button>`;}).join('');}
function showTable(name){activeTable=name;renderTableList();const tb=(data.tables||{})[name];if(!tb)return;
  document.getElementById('tableTitle').textContent=name;
  document.getElementById('tableInfo').textContent=`${num(tb.total)} ${t('rows')}`+(tb.shown<tb.total?` (${num(tb.shown)} ${t('shown')})`:'');
  document.getElementById('thead').innerHTML='<tr>'+tb.columns.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  if(!tb.rows.length){document.getElementById('tbody').innerHTML=`<tr><td colspan="${tb.columns.length}" style="color:var(--good);padding:16px;">${t('noHit')}</td></tr>`;return;}
  document.getElementById('tbody').innerHTML=tb.rows.map(r=>'<tr>'+r.map(v=>`<td title="${(v||'').replace(/"/g,'&quot;')}">${v||''}</td>`).join('')+'</tr>').join('');}
let logRuns=[];
function renderRuns(){const runs=DEMO.runs||[];logRuns=runs;const info=document.getElementById('logInfo');
  if(!runs.length){document.getElementById('logThead').innerHTML='';document.getElementById('logTbody').innerHTML=`<tr><td>${t('noRuns')}</td></tr>`;info.textContent='';return;}
  info.textContent=`${num(runs.length)} ${t('rows')} · ▶ ${t('histNote').toLowerCase()}`;const cols=Object.keys(runs[0]);
  document.getElementById('logThead').innerHTML='<tr><th></th>'+cols.map(c=>`<th>${c}</th>`).join('')+'</tr>';
  document.getElementById('logTbody').innerHTML=runs.map((r,i)=>`<tr style="cursor:pointer" title="${t('histNote')}" onclick="replayHistorical(${i})"><td>▶</td>`+cols.map(c=>`<td>${r[c]??''}</td>`).join('')+'</tr>').join('');}
function replayHistorical(i){const row=logRuns[i];if(!row)return;histRun=row;histIndex=i;dataShown=false;updateRunBtn();
  const banner=document.getElementById('banner');banner.className='banner empty';
  banner.innerHTML=`▶ ${t('histNote')}: <b>${row.idopont||''}</b> &nbsp;<button onclick="exitHistorical()" style="padding:3px 12px;">${t('backToLive')}</button>`;
  setTab('flow');render();
  Object.keys(chipTargets).forEach(id=>{const el=document.getElementById('chip-'+id);if(el)el.textContent='0';});
  setState('running','running');
  const total=replay(()=>{dataShown=true;finalizeCounts();renderCards();setState('done','ok');});countUpChips(Math.min(total,1600));}
function exitHistorical(){histRun=null;updateRunBtn();document.getElementById('banner').className='banner hidden';dataShown=true;flowing=false;finalizeCounts();renderChips();renderCards();renderHitl();markAllDone();redrawStatic();setState('done','ok');}
function render(){renderChips();renderMeta();renderCards();renderDownloads();renderHitl();renderTableList();if(activeTable)showTable(activeTable);resizeCanvases();if(dataShown)markAllDone();else blankFlow();redrawStatic();}
function setTab(w){['flow','data','log'].forEach(v=>{document.getElementById('view'+cap(v)).classList.toggle('on',v===w);document.getElementById('tab'+cap(v)).classList.toggle('on',v===w);});if(w==='log')renderRuns();if(w==='flow'){resizeCanvases();redrawStatic();}}
function setState(kind,key){const el=document.getElementById('runState');el.className='run-state '+kind;el.textContent=t(key);}
function countUpChips(dur){const t0=performance.now();(function step(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);Object.entries(chipTargets).forEach(([id,tgt])=>{const el=document.getElementById('chip-'+id);if(el)el.textContent=num(Math.round(tgt*e));});if(p<1)requestAnimationFrame(step);})(performance.now());}
function finalizeCounts(){chipDefs().forEach(x=>{const el=document.getElementById('chip-'+x.id);if(el)el.textContent=(x.v==null?'—':(x.suffix?num(x.v)+x.suffix:num(x.v)));});}

function applyData(d,{doReplay=false}={}){
  data=d;histRun=null;updateRunBtn();const banner=document.getElementById('banner');
  if(d.status==='empty'){errorNode=null;dataShown=false;setState('','empty');banner.className='banner empty';banner.textContent=t('empty');document.getElementById('chips').innerHTML='';return;}
  if(d.status==='error'){setState('error','error');banner.className='banner error';banner.textContent=d.error||'Hiba';errorNode=d.failed_node||null;redrawStatic();return;}
  errorNode=null;banner.className='banner hidden';
  if(doReplay){dataShown=false;render();setState('running','running');setTab('flow');
    Object.keys(chipTargets).forEach(id=>{const el=document.getElementById('chip-'+id);if(el)el.textContent='0';});
    const total=replay(()=>{dataShown=true;finalizeCounts();renderCards();setState('done','ok');});countUpChips(Math.min(total,1600));}
  else{dataShown=false;render();setState('','ready');}
}
function updateRunBtn(){const b=document.getElementById('runBtn');if(b)b.textContent=histRun?t('replay'):t('run');}
function onRunButton(){ if(histRun) replayHistorical(histIndex); else runPipeline(); }
// DEMO: nincs szerver — a beágyazott snapshotból dolgozunk, a futtatás szimulált replay
function load(){applyData(DEMO.snapshot);}
function runPipeline(){const btn=document.getElementById('runBtn');btn.disabled=true;
  applyData(DEMO.snapshot,{doReplay:true});renderRuns();
  setTimeout(()=>{btn.disabled=false;}, 4200);}

applyTheme();setLang(lang);renderLegend();bindCanvas();resizeCanvases();loop();load();renderRuns();
window.addEventListener('resize',()=>{resizeCanvases();redrawStatic();});
</script>
</body>
</html>
