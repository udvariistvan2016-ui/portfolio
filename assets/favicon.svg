<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Adatelemzés">
  <!-- Nagyító + növekvő oszlopdiagram, a főoldal tokenjeivel:
       ink #15181C, accent #1F6F5C, paper #F2F3F0.

       16 pixelre optimalizálva: nagy lencse, vastag vonalak, kevés elem.
       Ilyen méretben a szem már csak a kört, a kart és egy „diagram-textúrát"
       lát — a részletek finomítása ott nem segít, a kontraszt igen. -->
  <rect width="64" height="64" rx="13" fill="#F2F3F0"/>

  <!-- nagyító karja -->
  <line x1="41" y1="41" x2="57" y2="57"
        stroke="#15181C" stroke-width="9.5" stroke-linecap="round"/>

  <!-- lencse belseje -->
  <circle cx="26" cy="26" r="20" fill="#FFFFFF"/>

  <!-- oszlopok -->
  <g fill="#15181C">
    <rect x="14.5" y="29" width="7" height="8"  rx="1.2"/>
    <rect x="23.5" y="25" width="7" height="12" rx="1.2"/>
    <rect x="32.5" y="21" width="7" height="16" rx="1.2"/>
  </g>

  <!-- növekedési nyíl -->
  <g stroke="#1F6F5C" fill="#1F6F5C">
    <line x1="13" y1="26" x2="28" y2="16.5" stroke-width="4.4" stroke-linecap="round"/>
    <polygon points="36,12 31.8,19.4 27.6,12.6" stroke-width="1.4" stroke-linejoin="round"/>
  </g>

  <!-- lencse kerete legfelül -->
  <circle cx="26" cy="26" r="20" fill="none" stroke="#15181C" stroke-width="6"/>
</svg>
