<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Adatelemzés">
  <!-- Egyszerűsített favicon: nagyító + növekedési nyíl, oszlopok nélkül.
       16 pixelen az oszlopok bemosódtak; a nyíl egyedül is olvasható marad.
       A részletes változat (oszlopokkal): assets/ikon-nagyito-diagram.svg -->
  <rect width="64" height="64" rx="13" fill="#F2F3F0"/>
  <line x1="40" y1="40" x2="57" y2="57" stroke="#15181C" stroke-width="10" stroke-linecap="round"/>
  <circle cx="26" cy="26" r="19" fill="#FFFFFF"/>
  <g stroke="#1F6F5C" fill="#1F6F5C" stroke-linecap="round" stroke-linejoin="round">
    <line x1="15" y1="36" x2="29.5" y2="21.5" stroke-width="6"/>
    <polygon points="35,16 32.5,26.2 24.8,18.5" stroke-width="2"/>
  </g>
  <circle cx="26" cy="26" r="19" fill="none" stroke="#15181C" stroke-width="7"/>
</svg>
